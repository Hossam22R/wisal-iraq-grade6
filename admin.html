<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<title>لوحة إدارة البوابة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<script src="data/content.js"></script>
<script src="assets/firebase-config.js"></script>
<style>
.hero{padding:22px 0 14px}
.hero h1{font-size:clamp(28px,5vw,46px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px 12px 14px}
.item .t{font-weight:900;color:#fff}
.form{border:1px solid var(--glow);box-shadow:0 0 30px -14px var(--glow);background:rgba(11,18,32,.85);border-radius:var(--r);padding:18px;margin-bottom:14px}
.check{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--tx)}
.check input{width:20px;height:20px;accent-color:var(--glow)}
.stagebox{border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--panel)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.types button.on{background:color-mix(in srgb,var(--glow) 18%,transparent);border-color:var(--glow);color:#fff}
ol li{margin:4px 0;line-height:1.9}
</style>
</head>
<body>
<section class="hero">
  <div class="wrap">
    <div class="chip-live"><span class="node"></span><span id="kick">لوحة التحكم</span></div>
    <h1><span class="grad">إدارة البوابة</span></h1>
    <div class="who" id="who"></div>
  </div>
</section>
<nav class="topnav"><div class="wrap" id="nav"></div></nav>
<main class="wrap"><div id="view"><div class="empty">جارٍ التحميل…</div></div></main>
<footer>© مؤسسة وصال التعليمية · إعداد: حسام الجنابي</footer>

<script type="module">
import {LIVE, init, F, A, db, auth, ap, toEmail, userName, profile, docs, now, tsText, errText} from './assets/db.js';

const view = $('#view');
const err = (t, el='#ferr') => { const b = $(el); if(b) b.innerHTML = `<div class="alert">${esc(t)}</div>`; };
const busy = (btn, on) => { if(btn){ btn.disabled = on; if(on){ btn.dataset.t = btn.textContent; btn.textContent = 'جارٍ…'; } else if(btn.dataset.t) btn.textContent = btn.dataset.t; } };

/* ============ بدون Firebase: دليل التشغيل ============ */
if(!LIVE){
  theme('exams');
  view.innerHTML = `
    <div class="panel">
      <h3>المنصة غير مربوطة بقاعدة البيانات بعد</h3>
      <p class="muted" style="line-height:1.9">لتفعيل حسابات الإدارة والمشرفين والرسائل الخاصة وحفظ نتائج الامتحانات، أنشئ مشروع Firebase واتبع الدليل في الملف <code>docs/firebase-setup.md</code>، ثم الصق الإعدادات في <code>assets/firebase-config.js</code>.</p>
      <p class="muted">إلى أن يتم ذلك تستطيع إدارة المحتوى الثابت من <a href="admin-static.html">لوحة المحتوى الثابت</a>.</p>
    </div>`;
  await new Promise(() => {});   // نتوقف هنا بلا قاعدة بيانات
}

let ME = null, SITE = null, tab = store.get('wx3-tab') || 'posts';
try{ await init(); }catch(e){ view.innerHTML = `<div class="alert">تعذّر تحميل قاعدة البيانات: ${esc(errText(e))}</div>`; await new Promise(() => {}); }

/* ============ الدخول وإنشاء حساب المالك ============ */
async function start(){
  ME = await profile().catch(() => null);
  if(ME && !ME.active){ await A.signOut(auth); ME = null; }
  if(!ME) return (await F.getDoc(F.doc(db, 'meta', 'owner'))).exists() ? loginView() : ownerSetupView();
  await loadSettings();
  dashboard();
}
async function loadSettings(){
  const s = await F.getDoc(F.doc(db, 'settings', 'school'));
  SITE = s.exists() ? s.data() : {school: window.SCHOOL.school, stages: window.SCHOOL.stages};
}
function header(){
  $('#who').innerHTML = ME ? `<span class="tag">${esc(ME.name)}</span><span class="pill ${ME.role === 'owner' ? 'info' : 'on'}">${ME.role === 'owner' ? 'المالك — كل الصلاحيات' : 'مشرف نشر'}</span><button class="sm" id="out">تسجيل الخروج</button>` : '';
  if($('#out')) $('#out').onclick = async () => { await A.signOut(auth); location.reload(); };
}
function loginView(){
  theme('exams'); $('#nav').innerHTML = ''; header();
  view.innerHTML = `
    <div class="panel login">
      <h3>🔐 تسجيل الدخول</h3>
      <p class="muted">للمالك والمشرفين فقط. يحصل المشرف على اسم المستخدم وكلمة السر من المالك.</p>
      <form id="f" class="grid" style="grid-template-columns:1fr">
        <div><label for="u">اسم المستخدم</label><input id="u" dir="ltr" autocomplete="username" required></div>
        <div><label for="p">كلمة السر</label><input id="p" type="password" dir="ltr" autocomplete="current-password" required></div>
        <div id="ferr"></div>
        <button class="pri" id="go">دخول</button>
      </form>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const b = $('#go'); busy(b, true);
    try{
      await A.signInWithEmailAndPassword(auth, toEmail($('#u').value), $('#p').value);
      const p = await profile();
      if(!p || !p.active){ await A.signOut(auth); throw {code: 'disabled'}; }
      start();
    }catch(x){ busy(b, false); err(x.code === 'disabled' ? 'هذا الحساب غير مفعّل. راجع مالك الموقع.' : errText(x)); }
  };
}
function ownerSetupView(){
  theme('homework'); $('#nav').innerHTML = ''; header();
  view.innerHTML = `
    <div class="panel login">
      <h3>👑 إنشاء حساب المالك</h3>
      <p class="muted" style="line-height:1.9">هذه الخطوة مرة واحدة فقط. أول من ينشئ الحساب يصبح المالك والمتحكم الأول، ولا يمكن تغييره بعدها. أنشئه الآن قبل نشر رابط الموقع.</p>
      <form id="f" class="grid" style="grid-template-columns:1fr">
        <div><label for="n">الاسم الكامل</label><input id="n" required></div>
        <div><label for="t">الصفة</label><input id="t" value="مدير المرحلة الابتدائية"></div>
        <div><label for="u">اسم المستخدم (حروف إنكليزية وأرقام)</label><input id="u" dir="ltr" autocomplete="username" pattern="[A-Za-z0-9._@\\-]{3,}" required></div>
        <div><label for="p">كلمة السر (٨ أحرف على الأقل)</label><input id="p" type="password" dir="ltr" minlength="8" autocomplete="new-password" required></div>
        <div><label for="p2">أعد كتابة كلمة السر</label><input id="p2" type="password" dir="ltr" minlength="8" autocomplete="new-password" required></div>
        <div id="ferr"></div>
        <button class="pri" id="go">إنشاء حساب المالك</button>
      </form>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    if($('#p').value !== $('#p2').value) return err('كلمتا السر غير متطابقتين.');
    const b = $('#go'); busy(b, true);
    try{
      if(!auth.currentUser || auth.currentUser.isAnonymous) await A.createUserWithEmailAndPassword(auth, toEmail($('#u').value), $('#p').value);
      const uid = auth.currentUser.uid, name = $('#n').value.trim(), title = $('#t').value.trim();
      const w = F.writeBatch(db);
      w.set(F.doc(db, 'meta', 'owner'), {uid, at: now()});
      w.set(F.doc(db, 'users', uid), {name, title, username: userName(auth.currentUser.email), role: 'owner', active: true, inbox: true, stage: '', createdAt: now()});
      await w.commit();
      const w2 = F.writeBatch(db);
      w2.set(F.doc(db, 'settings', 'school'), {school: window.SCHOOL.school, stages: window.SCHOOL.stages});
      w2.set(F.doc(db, 'directory', uid), {name, title, stage: '', subjects: '', grades: '', inbox: true});
      await w2.commit();
      toast('تم إنشاء حساب المالك'); start();
    }catch(x){ busy(b, false); err(errText(x)); }
  };
}

/* ============ اللوحة ============ */
const TABS = () => ({
  posts: '📰 المنشورات', tests: '📝 الاختبارات والنتائج', inbox: '💬 الرسائل',
  ...(ME.role === 'owner' ? {accounts: '👥 الحسابات والصلاحيات', school: '⚙️ المدرسة والمراحل'} : {}),
  me: '👤 حسابي'
});
function dashboard(){
  header();
  $('#kick').textContent = SITE.school.name;
  if(!TABS()[tab]) tab = 'posts';
  $('#nav').innerHTML = Object.entries(TABS()).map(([k, l]) => `<a href="#" data-k="${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('');
  $('#nav').onclick = e => { const a = e.target.closest('[data-k]'); if(!a) return; e.preventDefault(); tab = a.dataset.k; store.set('wx3-tab', tab); dashboard(); };
  stopLive();
  ({posts: postsTab, tests: testsTab, inbox: inboxTab, accounts: accountsTab, school: schoolTab, me: meTab})[tab]();
}
let unsub = null;
const stopLive = () => { if(unsub){ unsub(); unsub = null; } };
const D = () => ({...SITE, stages: SITE.stages});
const canEdit = it => ME.role === 'owner' || it.authorUid === ME.uid;

/* ============ المنشورات ============ */
const SCHEMA = {
  channels:[['grade','القناة (جميع المراحل = قناة المدرسة العامة)','aud'],['body','نص المنشور','textarea',1],['date','التاريخ','date',1],['pinned','تثبيت في أعلى القناة','check'],['image','رابط صورة (اختياري) — لا تنشر صور التلاميذ إلا بموافقة أوليائهم','url'],['link','رابط (اختياري)','url']],
  announcements:[['title','عنوان التبليغ','text',1],['date','التاريخ','date',1],['grade','موجّه إلى','aud'],['urgent','تبليغ عاجل (يظهر أعلى الرئيسية)','check'],['body','نص التبليغ','textarea',1]],
  homework:[['title','عنوان الواجب','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['date','تاريخ الإعطاء','date',1],['due','آخر موعد للتسليم','date'],['body','تفاصيل الواجب','textarea',1],['link','رابط إضافي (اختياري)','url']],
  exams:[['title','عنوان الامتحان','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['date','تاريخ الامتحان','date',1],['body','ملاحظات ومفردات الامتحان','textarea'],['link','رابط إضافي (اختياري)','url']],
  lessons:[['title','عنوان الدرس','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['kind','نوع الدرس','select:فيديو|درس تفاعلي|ملف|رابط'],['date','تاريخ النشر','date',1],['body','وصف مختصر','textarea'],['link','رابط الدرس (يوتيوب يُعرض داخل البوابة)','url',1]],
  events:[['title','اسم المناسبة','text',1],['date','التاريخ','date',1],['grade','تخص','aud'],['place','المكان','text'],['body','التفاصيل','textarea']],
  activities:[['title','عنوان النشاط','text',1],['date','التاريخ','date',1],['grade','تخص','aud'],['body','وصف النشاط','textarea',1],['image','رابط صورة (اختياري) — لا تنشر صور التلاميذ إلا بموافقة أوليائهم','url'],['link','رابط إضافي (اختياري)','url']]
};
let ptype = store.get('wx3-ptype') || 'announcements', editing = null, POSTS = [];
const subjectOpts = (g, v) => subjectsFor(D(), g).map(s => `<option${s === v ? ' selected' : ''}>${esc(s)}</option>`).join('');
function field([k, l, type, req], v, it){
  const r = req ? ' <span style="color:var(--hot)">*</span>' : '', lab = `<label for="f-${k}">${l}${r}</label>`;
  if(type === 'check') return `<div class="full"><label class="check"><input type="checkbox" data-f="${k}" ${v ? 'checked' : ''}> ${l}</label></div>`;
  if(type === 'textarea') return `<div class="full">${lab}<textarea id="f-${k}" data-f="${k}">${esc(v)}</textarea></div>`;
  if(type === 'aud') return `<div>${lab}<select id="f-${k}" data-f="${k}">${audienceOptions(D(), v)}</select></div>`;
  if(type === 'grade') return `<div>${lab}<select id="f-${k}" data-f="${k}">${audienceOptions(D(), v || allGrades(D())[0], {all:false, stages:false})}</select></div>`;
  if(type === 'subject') return `<div>${lab}<select id="f-${k}" data-f="${k}">${subjectOpts(it.grade || allGrades(D())[0], v)}</select></div>`;
  if(type.startsWith('select:')) return `<div>${lab}<select id="f-${k}" data-f="${k}">${type.slice(7).split('|').map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select></div>`;
  const full = type === 'url' || k === 'title' ? ' class="full"' : '';
  return `<div${full}>${lab}<input id="f-${k}" type="${type === 'url' ? 'text' : type}" data-f="${k}" value="${esc(v)}" ${type === 'url' ? 'dir="ltr" placeholder="https://…"' : ''}></div>`;
}
async function postsTab(){
  theme(ptype);
  view.innerHTML = '<div class="empty">جارٍ تحميل المنشورات…</div>';
  try{ POSTS = docs(await F.getDocs(F.query(F.collection(db, 'posts'), F.where('type', '==', ptype)))); }
  catch(x){ view.innerHTML = `<div class="alert">${esc(errText(x))}</div>`; return; }
  drawPosts();
}
function drawPosts(){
  const ed = editing ? (editing.id ? POSTS.find(x => x.id === editing.id) : {}) : null;
  const list = POSTS.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const schema = SCHEMA[ptype].filter(f => !(ed && ed.examId && f[0] === 'link'));
  view.innerHTML = `
    <div class="types">${Object.keys(SCHEMA).map(k => `<button data-t="${k}" class="${k === ptype ? 'on' : ''}">${SECTIONS[k].icon} ${SECTIONS[k].label}</button>`).join('')}</div>
    <div class="bar"><h2 class="sec" style="margin:0;flex:1">${SECTIONS[ptype].icon} ${SECTIONS[ptype].label}</h2>${ed ? '' : '<button class="pri" id="add">+ إضافة</button>'}</div>
    ${['homework', 'exams'].includes(ptype) && !ed ? '<p class="muted">لإنشاء اختبار أو واجب إلكتروني يُصحَّح تلقائياً استخدم قسم «الاختبارات والنتائج»، ويظهر هنا تلقائياً.</p>' : ''}
    ${ed ? `<div class="form" id="form">
      <h3>${editing.id ? 'تعديل' : 'إضافة جديدة'}</h3>
      ${ed.examId ? '<p class="muted">هذا المنشور مرتبط باختبار إلكتروني؛ أسئلته تُعدَّل من قسم الاختبارات.</p>' : ''}
      <div class="grid">${schema.map(f => field(f, ed[f[0]] ?? (f[0] === 'date' ? todayISO() : ''), ed)).join('')}</div>
      <div id="ferr"></div>
      <div class="row" style="margin-top:14px"><button class="pri" id="ok">${editing.id ? 'حفظ التعديل' : 'نشر'}</button><button id="cancel">إلغاء</button></div>
    </div>` : ''}
    <div class="list">${list.map(it => `
      <div class="card item" style="--g:${SECTIONS[ptype].glow}">
        <div><span class="t">${esc(it.title || (it.body || '').slice(0, 70))}</span>
          <div class="muted">${esc([ptype === 'channels' ? (it.grade ? 'قناة ' + it.grade : 'قناة المدرسة العامة') : audienceLabel(it.grade || ''), it.subject, it.date && fmtDate(it.date, {day:'numeric', month:'long', year:'numeric'}), it.urgent && 'عاجل', it.examId && 'اختبار إلكتروني'].filter(Boolean).join('، '))}</div>
          <div class="muted">نشره: ${esc(it.authorName || '—')}</div></div>
        <div class="row">${canEdit(it) ? `<button class="sm" data-ed="${esc(it.id)}">تعديل</button><button class="sm warn" data-rm="${esc(it.id)}">حذف</button>` : '<span class="muted">للعرض فقط</span>'}</div>
      </div>`).join('') || '<div class="empty">لا يوجد شيء بعد. اضغط «إضافة».</div>'}</div>`;
  $$('[data-t]').forEach(b => b.onclick = () => { ptype = b.dataset.t; store.set('wx3-ptype', ptype); editing = null; postsTab(); });
  if($('#add')) $('#add').onclick = () => { editing = {id: null}; drawPosts(); };
  $$('[data-ed]').forEach(b => b.onclick = () => { editing = {id: b.dataset.ed}; drawPosts(); $('#form').scrollIntoView({block:'start'}); });
  $$('[data-rm]').forEach(b => b.onclick = async () => {
    const it = POSTS.find(x => x.id === b.dataset.rm);
    if(!await ask(`حذف «${it.title || (it.body || '').slice(0, 40)}»؟${it.examId ? ' سيُحذف المنشور فقط ويبقى الاختبار في قسم الاختبارات.' : ''}`, 'حذف')) return;
    try{ await F.deleteDoc(F.doc(db, 'posts', it.id)); toast('حُذف'); postsTab(); }catch(x){ toast(errText(x)); }
  });
  if(!$('#form')) return;
  const g = $('#form [data-f=grade]'), sub = $('#form [data-f=subject]');
  if(g && sub) g.onchange = () => { sub.innerHTML = subjectOpts(g.value, sub.value); };
  $('#cancel').onclick = () => { editing = null; drawPosts(); };
  $('#ok').onclick = async () => {
    const o = {};
    $$('#form [data-f]').forEach(el => o[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value.trim());
    const miss = schema.find(([f, , , req]) => req && !o[f]);
    if(miss) return err(`الحقل «${miss[1].split(' (')[0].split(' —')[0]}» مطلوب.`);
    if(o.due && o.date && o.due < o.date) return err('آخر موعد للتسليم قبل تاريخ الإعطاء.');
    if(['link', 'image'].some(f => o[f] && /\s/.test(o[f]))) return err('الرابط يحتوي على مسافات، تأكد من نسخه كاملاً.');
    const b = $('#ok'); busy(b, true);
    try{
      if(editing.id) await F.updateDoc(F.doc(db, 'posts', editing.id), {...o, updatedAt: now()});
      else await F.setDoc(F.doc(F.collection(db, 'posts')), {title: '', ...o, type: ptype, authorUid: ME.uid, authorName: ME.name, createdAt: now(), updatedAt: now()});
      editing = null; toast('تم النشر'); postsTab();
    }catch(x){ busy(b, false); err(errText(x)); }
  };
}

/* ============ الاختبارات والنتائج ============ */
const AR_N = '٠١٢٣٤٥٦٧٨٩';
function norm(s){
  return String(s || '').replace(/[ً-ْٰـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => AR_N.indexOf(d)).replace(/[.,،؛;:!?؟"'()\-]/g, ' ').replace(/(^|\s)ال(?=\S)/g, '$1').replace(/\s+/g, ' ').trim().toLowerCase();
}
const isRight = (q, key, a) => a === null || a === undefined || a === '' ? false : q.t === 'fill' ? String(key).split(/[\/|]/).map(norm).filter(Boolean).includes(norm(a)) : a === key;
const gradeOf = p => p >= 90 ? 'امتياز' : p >= 80 ? 'جيد جداً' : p >= 70 ? 'جيد' : p >= 60 ? 'متوسط' : p >= 50 ? 'مقبول' : 'راسب';
const studentLink = id => new URL('exams.html?id=' + id, location.href).href;
async function testsTab(){
  theme('exams');
  view.innerHTML = '<div class="empty">جارٍ تحميل الاختبارات…</div>';
  let list;
  try{
    const q = ME.role === 'owner' ? F.collection(db, 'exams') : F.query(F.collection(db, 'exams'), F.where('authorUid', '==', ME.uid));
    list = docs(await F.getDocs(q)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }catch(x){ view.innerHTML = `<div class="alert">${esc(errText(x))}</div>`; return; }
  view.innerHTML = `
    <div class="bar"><h2 class="sec" style="margin:0;flex:1">📝 الاختبارات والواجبات الإلكترونية</h2><a class="btn pri" href="exams.html?new=1">+ اختبار أو واجب جديد</a></div>
    <p class="muted">يُنشأ الاختبار في صفحة المنشئ ثم يُنشر بزر «نشر على المنصة»، فيظهر في البوابة تحت الامتحانات أو الواجبات، وتصل إجابات التلاميذ إلى هنا.</p>
    <div class="list">${list.map(x => `
      <div class="card item" style="--g:${SECTIONS[x.type === 'homework' ? 'homework' : 'exams'].glow}">
        <div><span class="t">${esc(x.title)}</span>
          <div class="meta"><span class="pill info">${x.type === 'homework' ? 'واجب' : 'امتحان'}</span><span class="pill ${x.status === 'open' ? 'on' : 'off'}">${x.status === 'open' ? 'مفتوح' : 'مغلق'}</span><span class="tag">${x.mode === 'protected' ? 'تصحيح محمي' : 'تصحيح فوري'}</span><span class="tag">الصف ${esc(x.grade)}</span><span class="tag">${esc(x.subject)}</span><span class="tag">${toAr(x.qs.length)} سؤالاً</span></div>

    try{

}
async function resultsView(x){
  view.innerHTML = '<div class="empty">جارٍ تحميل النتائج…</div>';
  let key, at;
  try{
    key = x.mode === 'protected' ? ((await F.getDoc(F.doc(db, 'examKeys', x.id))).data() || {}).key || [] : x.key || [];
    at = docs(await F.getDocs(F.query(F.collection(db, 'attempts'), F.where('examId', '==', x.id))));
  }catch(e){ view.innerHTML = `<div class="alert">${esc(errText(e))}</div>`; return; }
  const total = x.qs.reduce((s, q) => s + (+q.m || 0), 0);
  const rows = at.map(a => {
    const ok = x.qs.map((q, i) => isRight(q, key[i], a.answers[i]));
    const got = x.qs.reduce((s, q, i) => s + (ok[i] ? +q.m : 0), 0), pct = total ? Math.round(got / total * 100) : 0;
    const t = a.submittedAt && a.submittedAt.toDate ? a.submittedAt.toDate() : null;
    return {...a, ok, got, pct, g: gradeOf(pct), t, mins: t ? Math.max(1, Math.round((t - a.startedAt) / 60000)) : null};
  }).sort((a, b) => a.name.localeCompare(b.name, 'ar') || ((a.t || 0) - (b.t || 0)));
  const names = rows.reduce((m, r) => (m[r.name] = (m[r.name] || 0) + 1, m), {});
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.pct, 0) / rows.length) : 0;
  const pass = rows.filter(r => r.pct >= 50).length;
  const per = x.qs.map((q, i) => rows.length ? Math.round(rows.filter(r => r.ok[i]).length / rows.length * 100) : 0);
  const unpublished = x.mode === 'protected' && rows.some(r => !r.result || r.result.got !== r.got);
  view.innerHTML = `
    <button class="btn" id="back">→ كل الاختبارات</button>
    <h2 class="sec">نتائج: ${esc(x.title)}</h2>
    <div class="muted">الصف ${esc(x.grade)}، ${esc(x.subject)}، الدرجة الكلية ${toAr(total)}، ${x.mode === 'protected' ? 'تصحيح محمي' : 'تصحيح فوري'}</div>
    <div class="kpis">
      <div class="kpi"><b>${toAr(rows.length)}</b><span>محاولة مسلّمة</span></div>
      <div class="kpi"><b>${toAr(avg)}٪</b><span>متوسط الدرجات</span></div>
      <div class="kpi"><b>${toAr(pass)}</b><span>ناجح (٥٠٪ فأكثر)</span></div>
      <div class="kpi"><b>${toAr(rows.length - pass)}</b><span>يحتاج متابعة</span></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button id="csv" ${rows.length ? '' : 'disabled'}>⬇ تنزيل النتائج (Excel)</button>
      ${x.mode === 'protected' ? `<button class="pri" id="pubres" ${rows.length ? '' : 'disabled'}>${unpublished ? 'اعتماد النتائج وإظهارها للتلاميذ' : '✔ النتائج معتمدة'}</button>` : ''}
    </div>
    ${rows.length ? `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>#</th><th>الاسم</th><th>الشعبة</th><th>الدرجة</th><th>النسبة</th><th>التقدير</th><th>وقت التسليم</th><th>المدة</th><th>مغادرة الصفحة</th>${x.mode === 'protected' ? '<th>معتمدة</th>' : ''}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr>
        <td>${toAr(i + 1)}</td><td class="wrap">${esc(r.name)}${names[r.name] > 1 ? ' <span class="pill off">مكرر</span>' : ''}</td><td>${esc(r.section || '—')}</td>
        <td><b>${toAr(r.got)}</b> / ${toAr(total)}</td><td>${toAr(r.pct)}٪</td><td><span class="pill ${r.pct >= 50 ? 'on' : 'off'}">${r.g}</span></td>
        <td>${esc(tsText(r.submittedAt))}${r.timeout ? ' <span class="pill off">انتهى الوقت</span>' : ''}</td><td>${r.mins ? toAr(r.mins) + ' د' : '—'}</td><td>${r.leaves ? toAr(r.leaves) : '—'}</td>
        ${x.mode === 'protected' ? `<td>${r.result && r.result.got === r.got ? '✔' : '—'}</td>` : ''}
      </tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:20px">تحليل الأسئلة</h3>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>السؤال</th><th>نسبة الإجابة الصحيحة</th></tr></thead>
      <tbody>${x.qs.map((q, i) => `<tr><td class="wrap">${toAr(i + 1)}. ${esc(q.q)}</td><td><span class="pill ${per[i] >= 50 ? 'on' : 'off'}">${toAr(per[i])}٪</span></td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">لم يسلّم أي تلميذ بعد.</div>'}`;
  $('#back').onclick = testsTab;
  if($('#csv')) $('#csv').onclick = () => {
    const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['الاسم', 'الصف', 'الشعبة', 'الدرجة', 'من', 'النسبة', 'التقدير', 'وقت التسليم', 'المدة بالدقائق', 'مغادرة الصفحة'].map(cell).join(',')]
      .concat(rows.map(r => [r.name, r.grade, r.section, r.got, total, r.pct, r.g, tsText(r.submittedAt), r.mins, r.leaves].map(cell).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    a.download = `نتائج ${x.title}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  if($('#pubres')) $('#pubres').onclick = async () => {
    if(!await ask(`اعتماد درجات ${toAr(rows.length)} تلميذاً وإظهارها لهم؟`, 'اعتماد')) return;
    const b = $('#pubres'); busy(b, true);
    try{
      for(let i = 0; i < rows.length; i += 400){
        const w = F.writeBatch(db);
        rows.slice(i, i + 400).forEach(r => w.update(F.doc(db, 'attempts', r.id), {result: {got: r.got, total, pct: r.pct, grade: r.g}}));
        await w.commit();
      }
      toast('اعتُمدت النتائج'); resultsView(x);
    }catch(e){ busy(b, false); toast(errText(e)); }
  };
}

function threadView(t){
  stopLive();
  view.innerHTML = `
    <button class="btn" id="back">→ كل الرسائل</button>
    <h2 class="sec">${esc(t.parentName)} <span class="muted" style="font-weight:700">ولي أمر ${esc(t.studentName)}، الصف ${esc(t.grade)}${t.section ? ' / ' + esc(t.section) : ''}</span></h2>

    <div class="grid" style="grid-template-columns:1fr;margin-top:12px">
      <div><label for="rep">الرد</label><textarea id="rep" placeholder="اكتب ردك هنا"></textarea></div>
    </div>
    <div id="ferr"></div>

  $('#back').onclick = inboxTab;
  const ref = F.doc(db, 'threads', t.id);
  if(t.unreadStaff) F.updateDoc(ref, {unreadStaff: false}).catch(() => {});
  unsub = F.onSnapshot(F.query(F.collection(db, 'threads', t.id, 'msgs'), F.orderBy('at')), s => {
    const c = $('#chat'); if(!c) return;
    c.innerHTML = docs(s).map(m => `<div class="bubble ${m.from === 'staff' ? 'me' : 'them'}">${esc(m.text)}<small>${esc(m.from === 'staff' ? (m.byName || 'الإدارة') : t.parentName)}، ${esc(tsText(m.at))}</small></div>`).join('');
    c.scrollTop = c.scrollHeight;
  }, e => err(errText(e)));
  $('#send').onclick = async () => {
    const text = $('#rep').value.trim(); if(!text) return;
    const b = $('#send'); busy(b, true);
    try{
      const w = F.writeBatch(db);
      w.set(F.doc(F.collection(db, 'threads', t.id, 'msgs')), {from: 'staff', text, at: now(), by: ME.uid, byName: ME.name});
      w.update(ref, {updatedAt: now(), lastFrom: 'staff', unreadStaff: false, unreadParent: true});
      await w.commit(); $('#rep').value = ''; busy(b, false);
    }catch(e){ busy(b, false); err(errText(e)); }
  };
  $('#st').onclick = async () => { t.status = t.status === 'closed' ? 'open' : 'closed'; try{ await F.updateDoc(ref, {status: t.status}); threadView(t); }catch(e){ err(errText(e)); } };
}

      <div><label for="es">المرحلة</label><select id="es">${stageOpts(u.stage)}</select></div>
      <div><label for="eb">المواد</label><input id="eb" value="${esc(u.subjects || '')}"></div></div>
      <div class="row" style="margin-top:12px"><button class="pri" id="esv">حفظ</button><button id="ecl">إلغاء</button></div></div>`;
    document.body.appendChild(box);
    $('#ecl').onclick = () => box.remove();
    $('#esv').onclick = async () => {
      Object.assign(u, {name: $('#en').value.trim() || u.name, title: $('#et').value.trim(), stage: $('#es').value, subjects: $('#eb').value.trim()});
      try{ const w = F.writeBatch(db); w.update(F.doc(db, 'users', u.id), {name: u.name, title: u.title, stage: u.stage, subjects: u.subjects}); syncDir(w, u); await w.commit(); box.remove(); if(u.id === ME.uid) ME.name = u.name; accountsTab(); }catch(e){ toast(errText(e)); }
    };
  });
}

/* ============ المدرسة والمراحل (المالك) ============ */
function schoolTab(){
  theme('exams');
  const s = SITE.school;
  const f = (k, l, wide, t='text') => `<div${wide ? ' class="full"' : ''}><label>${l}</label><input type="${t}" data-s="${k}" value="${esc(s[k] ?? '')}"></div>`;
  view.innerHTML = `
    <h2 class="sec" style="margin-top:0">⚙️ بيانات المدرسة</h2>
    <div class="panel"><div class="grid">
      ${f('name', 'اسم المدرسة', 1)}${f('slogan', 'العبارة التعريفية', 1)}${f('founded', 'سنة التأسيس', 0, 'number')}${f('year', 'العام الدراسي')}${f('hours', 'أوقات الدوام')}${f('address', 'العنوان')}${f('phone', 'هاتف المدرسة')}
    </div></div>
    <h2 class="sec">🏫 المراحل والصفوف والمواد</h2>
    <div class="cols">${SITE.stages.map((st, i) => `
      <div class="stagebox">
        <label>اسم المرحلة</label><input data-st="${i}" data-p="name" value="${esc(st.name)}">
        <div class="grid" style="margin-top:10px">
          <div><label>الصفوف (صف في كل سطر)</label><textarea data-st="${i}" data-p="grades" style="min-height:200px">${esc(st.grades.join('\n'))}</textarea></div>
          <div><label>المواد (مادة في كل سطر)</label><textarea data-st="${i}" data-p="subjects" style="min-height:200px">${esc(st.subjects.join('\n'))}</textarea></div>
        </div>
      </div>`).join('')}</div>
    <p class="muted">تنبيه: إن غيّرت اسم صف أو مرحلة فالمنشورات القديمة المرتبطة بالاسم القديم تحتاج تعديلاً.</p>
    <div class="row" style="margin-top:12px"><button class="pri" id="sv">حفظ الإعدادات</button></div>
    <h2 class="sec">📦 نقل المحتوى القديم</h2>
    <div class="panel"><p class="muted">ينقل المحتوى الموجود في الملف الثابت <code>data/content.js</code> (التبليغات والواجبات والدروس وغيرها) إلى قاعدة البيانات باسمك. استخدمه مرة واحدة فقط.</p>
      <button id="imp">نقل المحتوى إلى قاعدة البيانات</button></div>`;
  $('#sv').onclick = async () => {
    const lines = t => [...new Set(t.split('\n').map(x => x.trim()).filter(Boolean))];
    const st = SITE.stages.map((s, i) => ({name: $(`[data-st="${i}"][data-p=name]`).value.trim(), grades: lines($(`[data-st="${i}"][data-p=grades]`).value), subjects: lines($(`[data-st="${i}"][data-p=subjects]`).value)}));
    if(st.some(s => !s.name || !s.grades.length || !s.subjects.length)) return toast('لكل مرحلة اسم وصف ومادة على الأقل');
    const school = {...SITE.school};
    $$('[data-s]').forEach(el => school[el.dataset.s] = el.type === 'number' ? (+el.value || '') : el.value.trim());
    try{ await F.setDoc(F.doc(db, 'settings', 'school'), {school, stages: st}); SITE = {school, stages: st}; toast('حُفظت الإعدادات'); }catch(e){ toast(errText(e)); }
  };
  $('#imp').onclick = async () => {
    const types = Object.keys(SCHEMA), items = types.flatMap(t => (window.SCHOOL[t] || []).map(it => ({...it, type: t})));
    if(!await ask(`نقل ${toAr(items.length)} عنصراً من الملف الثابت؟`, 'نقل')) return;
    try{
      const w = F.writeBatch(db);
      items.forEach(({id, ...it}) => w.set(F.doc(F.collection(db, 'posts')), {...it, authorUid: ME.uid, authorName: ME.name, createdAt: now(), updatedAt: now()}));
      await w.commit(); toast('تم النقل');
    }catch(e){ toast(errText(e)); }
  };
}

/* ============ حسابي ============ */
function meTab(){
  theme('lessons');
  view.innerHTML = `
    <div class="panel login">
      <h3>👤 ${esc(ME.name)}</h3>
      <p class="muted">اسم المستخدم: <span dir="ltr">${esc(ME.username || userName(ME.email))}</span>، الصفة: ${esc(ME.title || '—')}</p>
      <form id="pf" class="grid" style="grid-template-columns:1fr">
        <div><label for="np">كلمة سر جديدة (٨ أحرف على الأقل)</label><input id="np" type="password" dir="ltr" minlength="8" autocomplete="new-password" required></div>
        <div id="ferr"></div>
        <button class="pri" id="cp">تغيير كلمة السر</button>
      </form>
    </div>`;
  $('#pf').onsubmit = async e => {
    e.preventDefault(); const b = $('#cp'); busy(b, true);
    try{ await A.updatePassword(auth.currentUser, $('#np').value); toast('تم تغيير كلمة السر'); $('#np').value = ''; }catch(x){ err(errText(x)); }
    busy(b, false);
  };
}

start().catch(e => { view.innerHTML = `<div class="alert">${esc(errText(e))}</div>`; });
</script>
