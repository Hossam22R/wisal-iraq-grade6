<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<title>لوحة إدارة البوابة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<script src="data/content.js"></script>
<style>
.hero{padding:22px 0 14px}
.hero h1{font-size:clamp(28px,5vw,46px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px 12px 14px}
.item .t{font-weight:900;color:#fff}
.form{border:1px solid var(--glow);box-shadow:0 0 30px -14px var(--glow);background:rgba(11,18,32,.85);border-radius:var(--r);padding:18px;margin-bottom:14px}
.check{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--tx)}
.check input{width:20px;height:20px;accent-color:var(--glow)}
.state{font-weight:700;padding:4px 14px;border-radius:20px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.state.dirty{color:#FFEB00;border:1px solid #FFEB00}
.state.clean{color:#39FF14;border:1px solid #39FF14}
ol li{margin:4px 0;line-height:1.9}
.stagebox{border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--panel)}
</style>
</head>
<body>
<section class="hero">
  <div class="wrap"><div>
    <div class="chip-live"><span class="node"></span>لوحة التحكم · للإدارة فقط</div>
    <h1><span class="grad">إدارة البوابة</span></h1>
    <p>أضف المحتوى وعدّله هنا، ثم نزّل ملف المحتوى وارفعه إلى المستودع لينشر للجميع.</p>
  </div></div>
</section>
<nav class="topnav"><div class="wrap" id="nav"></div></nav>
<main class="wrap">
  <div class="panel" style="margin-bottom:16px">
    <div class="bar">
      <span id="state" class="state"></span>
      <div class="row">
        <a class="btn" href="index.html?preview=1" target="_blank">👁 معاينة البوابة</a>
        <a class="btn" href="exams.html" target="_blank">📝 منشئ الامتحانات والواجبات</a>
        <button class="pri" id="dl">⬇ تنزيل ملف المحتوى</button>
      </div>
    </div>
    <div id="warn"></div>
  </div>
  <div id="view"></div>
</main>
<footer>© مؤسسة وصال التعليمية · إعداد: حسام الجنابي</footer>

<script>
const LIVE = JSON.stringify(window.SCHOOL);
const sig = s => { let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return h; };
let D = store.get(DRAFT_KEY) || JSON.parse(LIVE);
let tab = store.get('wx2-admin-tab') || 'announcements';
let editing = null;

/* الحقول: [المفتاح، التسمية، النوع، مطلوب]
   aud = الجمهور (كل المراحل أو مرحلة أو صف)، grade = صف محدد، subject = مادة حسب مرحلة الصف */
const SCHEMA = {
  announcements:[['title','عنوان التبليغ','text',1],['date','التاريخ','date',1],['grade','موجّه إلى','aud'],['urgent','تبليغ عاجل (يظهر أعلى الرئيسية)','check'],['body','نص التبليغ','textarea',1]],
  homework:[['title','عنوان الواجب','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['date','تاريخ الإعطاء','date',1],['due','آخر موعد للتسليم','date'],['body','تفاصيل الواجب','textarea',1],['link','رابط واجب تفاعلي (اختياري) — أنشئه من «منشئ الامتحانات» والصقه هنا','url']],
  exams:[['title','عنوان الامتحان','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['date','تاريخ الامتحان (يُفتح الرابط في هذا اليوم)','date',1],['body','ملاحظات ومفردات الامتحان','textarea'],['link','رابط الامتحان الإلكتروني (اختياري)','url']],
  lessons:[['title','عنوان الدرس','text',1],['grade','الصف','grade',1],['subject','المادة','subject',1],['kind','نوع الدرس','select:فيديو|درس تفاعلي|ملف|رابط'],['date','تاريخ النشر','date',1],['body','وصف مختصر','textarea'],['link','رابط الدرس (يوتيوب يُعرض داخل البوابة)','url',1]],
  events:[['title','اسم المناسبة','text',1],['date','التاريخ','date',1],['grade','تخص','aud'],['place','المكان','text'],['body','التفاصيل','textarea']],
  activities:[['title','عنوان النشاط','text',1],['date','التاريخ','date',1],['grade','تخص','aud'],['body','وصف النشاط','textarea',1],['image','رابط صورة (اختياري) — لا تنشر صور التلاميذ إلا بموافقة أوليائهم','url'],['link','رابط إضافي (اختياري)','url']],
  staff:[['name','الاسم','text',1],['role','الصفة','select:المشرف العام|مدير المرحلة الابتدائية|مدير المرحلة الثانوية|معاون المدير|معلم|معلمة|مدرّس|مدرّسة|المرشد التربوي|الإدارة'],['stage','المرحلة','stage'],['subjects','المواد','text'],['grades','الصفوف','text'],['whatsapp','رقم واتساب بالصيغة الدولية، مثل 9647XXXXXXXXX','tel'],['telegram','اسم مستخدم تلكرام (اختياري)','text']]
};
const TABS = {...Object.fromEntries(Object.entries(SECTIONS).filter(([k]) => k !== 'contact').map(([k, s]) => [k, s.icon + ' ' + s.label])), staff:'💬 الكادر والتواصل', settings:'⚙️ المدرسة والمراحل', publish:'🚀 النشر'};
const THEME_OF = {staff:'contact', settings:'exams', publish:'homework'};

function save(){
  if(store.get(DRAFT_KEY) === null) store.set(BASE_KEY, sig(LIVE));
  store.set(DRAFT_KEY, D); status();
}
function status(){
  const dirty = JSON.stringify(D) !== LIVE;
  $('#state').className = 'state ' + (dirty ? 'dirty' : 'clean');
  $('#state').innerHTML = `<span class="node" style="--glow:${dirty ? '#FFEB00' : '#39FF14'}"></span>${dirty ? 'لديك تعديلات لم تُنشر بعد' : 'المسودة مطابقة للمنشور'}`;
  const b = store.get(BASE_KEY), stale = dirty && b !== null && b !== sig(LIVE);
  $('#warn').innerHTML = stale ? '<div class="alert">تغيّر المحتوى المنشور منذ بدأت هذه المسودة (ربما عُدّل من جهاز آخر). إن نشرت مسودتك فستحلّ محلّه. لبدء مسودة جديدة من المنشور استخدم «التراجع إلى المنشور» في قسم النشر.</div>' : '';
}
function drawNav(){ $('#nav').innerHTML = Object.entries(TABS).map(([k, l]) => `<a href="#" data-k="${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join(''); }
$('#nav').onclick = e => { const a = e.target.closest('[data-k]'); if(!a) return; e.preventDefault(); tab = a.dataset.k; editing = null; store.set('wx2-admin-tab', tab); draw(); };

/* ============ النماذج ============ */
function field([k, l, type, req], v, it){
  const r = req ? ' <span style="color:var(--hot)">*</span>' : '';
  const lab = `<label for="f-${k}">${l}${r}</label>`;
  if(type === 'check') return `<div class="full"><label class="check"><input type="checkbox" data-f="${k}" ${v ? 'checked' : ''}> ${l}</label></div>`;
  if(type === 'textarea') return `<div class="full">${lab}<textarea id="f-${k}" data-f="${k}">${esc(v)}</textarea></div>`;
  if(type === 'aud') return `<div>${lab}<select id="f-${k}" data-f="${k}">${audienceOptions(D, v)}</select></div>`;
  if(type === 'grade') return `<div>${lab}<select id="f-${k}" data-f="${k}">${audienceOptions(D, v || allGrades(D)[0], {all:false, stages:false})}</select></div>`;
  if(type === 'subject') return `<div>${lab}<select id="f-${k}" data-f="${k}">${subjectOpts(it.grade || allGrades(D)[0], v)}</select></div>`;
  if(type === 'stage') return `<div>${lab}<select id="f-${k}" data-f="${k}"><option value="">جميع المراحل</option>${D.stages.map(s => `<option${s.name === v ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`;
  if(type.startsWith('select:')) return `<div>${lab}<select id="f-${k}" data-f="${k}">${type.slice(7).split('|').map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select></div>`;
  const full = type === 'url' || k === 'title' ? ' class="full"' : '';
  return `<div${full}>${lab}<input id="f-${k}" type="${type === 'url' ? 'text' : type}" data-f="${k}" value="${esc(v)}" ${type === 'url' || type === 'tel' ? 'dir="ltr" placeholder="https://…"' : ''}></div>`;
}
const subjectOpts = (g, v) => subjectsFor(D, g).map(s => `<option${s === v ? ' selected' : ''}>${esc(s)}</option>`).join('');
function summary(it){
  const bits = [it.grade !== undefined && audienceLabel(it.grade), it.subject, it.date && fmtDate(it.date, {day:'numeric', month:'long', year:'numeric'}), it.role, it.stage && 'المرحلة ' + it.stage, it.urgent && 'عاجل'].filter(Boolean);
  return `<span class="t">${esc(it.title || it.name)}</span><div class="muted">${esc(bits.join('، '))}</div>`;
}
function listTab(k){
  const arr = D[k] || (D[k] = []);
  const ed = editing && editing.k === k ? (editing.id ? arr.find(x => x.id === editing.id) : {}) : null;
  const sorted = arr.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `
    <div class="bar"><h2 class="sec" style="margin:0;flex:1">${TABS[k]}</h2>${ed ? '' : '<button class="pri" id="add">+ إضافة</button>'}</div>
    ${ed ? `<div class="form" id="form">
      <h3>${editing.id ? 'تعديل' : 'إضافة جديدة'}</h3>
      <div class="grid">${SCHEMA[k].map(f => field(f, ed[f[0]] ?? (f[0] === 'date' ? todayISO() : ''), ed)).join('')}</div>
      <div id="ferr"></div>
      <div class="row" style="margin-top:14px"><button class="pri" id="ok">حفظ</button><button id="cancel">إلغاء</button></div>
    </div>` : ''}
    <div class="list">${sorted.map(it => `
      <div class="card item" style="--g:${(SECTIONS[k] || SECTIONS.contact).glow}"><div>${summary(it)}</div>
        <div class="row"><button class="sm" data-ed="${esc(it.id)}">تعديل</button><button class="sm" data-cp="${esc(it.id)}">نسخ</button><button class="sm warn" data-rm="${esc(it.id)}">حذف</button></div>
      </div>`).join('') || '<div class="empty">لا يوجد شيء بعد. اضغط «إضافة».</div>'}</div>`;
}
function wireList(k){
  const arr = D[k];
  $('#add') && ($('#add').onclick = () => { editing = {k, id:null}; draw(); $('#form [data-f]')?.focus(); });
  $$('[data-ed]').forEach(b => b.onclick = () => { editing = {k, id:b.dataset.ed}; draw(); $('#form').scrollIntoView({block:'start'}); });
  $$('[data-cp]').forEach(b => b.onclick = () => { const c = {...arr.find(x => x.id === b.dataset.cp), id:uid()}; if(c.title) c.title += ' (نسخة)'; arr.push(c); save(); editing = {k, id:c.id}; draw(); });
  $$('[data-rm]').forEach(b => b.onclick = () => { const it = arr.find(x => x.id === b.dataset.rm); ask(`حذف «${it.title || it.name}»؟`, 'حذف').then(ok => { if(ok){ arr.splice(arr.indexOf(it), 1); save(); draw(); } }); });
  if(!$('#form')) return;
  /* تتغير قائمة المواد حسب مرحلة الصف المختار */
  const g = $('#form [data-f=grade]'), sub = $('#form [data-f=subject]');
  if(g && sub) g.onchange = () => { const v = sub.value; sub.innerHTML = subjectOpts(g.value, v); };
  $('#cancel').onclick = () => { editing = null; draw(); };
  $('#ok').onclick = () => {
    const o = {};
    $$('#form [data-f]').forEach(el => o[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value.trim());
    const miss = SCHEMA[k].find(([f, , , req]) => req && !o[f]);
    const err = t => $('#ferr').innerHTML = `<div class="alert">${t}</div>`;
    if(miss) return err(`الحقل «${miss[1].split(' (')[0].split(' —')[0]}» مطلوب.`);
    if(o.due && o.date && o.due < o.date) return err('آخر موعد للتسليم قبل تاريخ الإعطاء.');
    if(['link', 'image'].some(f => o[f] && /\s/.test(o[f]))) return err('الرابط يحتوي على مسافات، تأكد من نسخه كاملاً.');
    if(o.whatsapp && !/^\d{10,15}$/.test(o.whatsapp.replace(/\D/g, ''))) return err('رقم واتساب غير صحيح. اكتبه بالصيغة الدولية مثل 9647XXXXXXXXX.');
    if(editing.id) Object.assign(arr.find(x => x.id === editing.id), o); else arr.push({id:uid(), ...o});
    editing = null; save(); draw(); toast('تم الحفظ في المسودة');
  };
}

/* ============ المدرسة والمراحل ============ */
function settingsTab(){
  const s = D.school;
  const f = (k, l, wide, t='text') => `<div${wide ? ' class="full"' : ''}><label>${l}</label><input type="${t}" data-s="${k}" value="${esc(s[k])}"></div>`;
  return `
    <h2 class="sec" style="margin-top:0">⚙️ بيانات المدرسة</h2>
    <div class="panel"><div class="grid">
      ${f('name', 'اسم المدرسة', 1)}${f('slogan', 'العبارة التعريفية', 1)}${f('founded', 'سنة التأسيس', 0, 'number')}${f('year', 'العام الدراسي')}${f('hours', 'أوقات الدوام')}${f('address', 'العنوان')}${f('phone', 'هاتف المدرسة')}
    </div></div>
    <h2 class="sec">🏫 المراحل والصفوف والمواد</h2>
    <div class="cols">${D.stages.map((st, i) => `
      <div class="stagebox">
        <label>اسم المرحلة</label><input data-st="${i}" data-p="name" value="${esc(st.name)}">
        <div class="grid" style="margin-top:10px">
          <div><label>الصفوف (صف في كل سطر)</label><textarea data-st="${i}" data-p="grades" style="min-height:200px">${esc(st.grades.join('\n'))}</textarea></div>
          <div><label>المواد (مادة في كل سطر)</label><textarea data-st="${i}" data-p="subjects" style="min-height:200px">${esc(st.subjects.join('\n'))}</textarea></div>
        </div>
      </div>`).join('')}</div>
    <p class="muted">تنبيه: إن غيّرت اسم صف أو مرحلة فالعناصر القديمة المرتبطة بالاسم القديم تحتاج تعديلاً يدوياً.</p>
    <div class="row" style="margin-top:12px"><button class="pri" id="sv">حفظ الإعدادات</button></div>`;
}
function wireSettings(){
  $('#sv').onclick = () => {
    const lines = t => [...new Set(t.split('\n').map(x => x.trim()).filter(Boolean))];
    const st = D.stages.map((s, i) => ({
      name: $(`[data-st="${i}"][data-p=name]`).value.trim(),
      grades: lines($(`[data-st="${i}"][data-p=grades]`).value),
      subjects: lines($(`[data-st="${i}"][data-p=subjects]`).value)
    }));
    if(st.some(s => !s.name || !s.grades.length || !s.subjects.length)) return toast('لكل مرحلة اسم وصف ومادة على الأقل');
    $$('[data-s]').forEach(el => D.school[el.dataset.s] = el.type === 'number' ? (+el.value || '') : el.value.trim());
    D.stages = st; save(); toast('حُفظت الإعدادات');
  };
}

/* ============ النشر ============ */
const fileText = () => '/* محتوى بوابة المدرسة — يُنشأ هذا الملف من لوحة الإدارة (admin.html) ثم يُرفع مكان القديم */\nwindow.SCHOOL = ' + JSON.stringify(D, null, 1) + ';\n';
function download(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([fileText()], {type:'text/javascript'}));
  a.download = 'content.js'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#dl').onclick = download;
function publishTab(){
  return `
    <h2 class="sec" style="margin-top:0">🚀 نشر التعديلات للجميع</h2>
    <div class="panel">
      <p>كل ما تضيفه في هذه اللوحة يُحفظ على هذا الجهاز فقط. لينشر للتلاميذ وأولياء الأمور:</p>
      <ol>
        <li>اضغط <b>«تنزيل ملف المحتوى»</b> فينزل ملف اسمه <code>content.js</code>.</li>
        <li>افتح مستودع الموقع في GitHub، ثم مجلد <code>data</code>.</li>
        <li>اختر <b>Add file ← Upload files</b> وارفع الملف <code>content.js</code> (يحلّ محلّ القديم).</li>
        <li>اضغط <b>Commit changes</b>. يظهر التحديث في الموقع خلال دقائق.</li>
      </ol>
      <div class="row" style="margin-top:10px"><button class="pri" id="dl2">⬇ تنزيل ملف المحتوى</button></div>
      <h3 style="margin-top:22px">صلاحيات الإدارة</h3>
      <p class="muted" style="line-height:1.9">النشر لا يتم إلا بحساب GitHub المالك للمستودع، فهو المتحكم الأول. يستطيع المشرف العام ومدير الثانوية إعداد تعديلاتهم في هذه اللوحة وإرسال ملف <code>content.js</code> إلى المالك ليراجعه وينشره. ولا تحتاج اللوحة كلمة مرور لأنها لا تنشر شيئاً بنفسها.</p>
      <h3 style="margin-top:18px">أدوات أخرى</h3>
      <div class="row">
        <button id="imp">فتح ملف محتوى من الجهاز</button>
        <button class="warn" id="reset">التراجع إلى المنشور (حذف المسودة)</button>
        <input type="file" id="file" accept=".js,.json" hidden>
      </div>
    </div>`;
}
function wirePublish(){
  $('#dl2').onclick = download;
  $('#imp').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    try{
      const t = await e.target.files[0].text();
      const o = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
      if(!o.school || !Array.isArray(o.stages)) throw 0;
      D = o; save(); draw(); toast('تم فتح الملف');
    }catch(_){ toast('الملف غير صالح'); }
  };
  $('#reset').onclick = () => { ask('ستُحذف كل التعديلات غير المنشورة. متأكد؟', 'نعم، احذف المسودة').then(ok => { if(ok){ D = JSON.parse(LIVE); store.del(DRAFT_KEY); store.set(BASE_KEY, sig(LIVE)); status(); draw(); } }); };
}

function draw(){
  drawNav(); theme(SECTIONS[tab] ? tab : THEME_OF[tab]);
  const v = $('#view');
  if(tab === 'settings'){ v.innerHTML = settingsTab(); wireSettings(); }
  else if(tab === 'publish'){ v.innerHTML = publishTab(); wirePublish(); }
  else { v.innerHTML = listTab(tab); wireList(tab); }
  v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
}
status(); draw();
</script>
</body>
</html>
