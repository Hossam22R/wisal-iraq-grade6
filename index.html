<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1220">
<title>بوابة مدارس براعم كربلاء الأهلية</title>
<link rel="stylesheet" href="assets/fonts/cairo.css">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<script src="data/content.js"></script>
<script src="assets/firebase-config.js"></script>
</head>
<body>
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <div class="chip-live"><span class="node"></span><span id="today"></span></div>
      <h1 id="title"></h1>
      <p id="slogan"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="orb" id="orb"></div>
  </div>
  <div class="wrap">
    <div class="selector" aria-label="اختر المرحلة والصف">
      <div class="seg" id="stages"></div>
      <div class="chips" id="grades"></div>
    </div>
  </div>
</section>
<nav class="topnav" aria-label="أقسام البوابة"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="view"></main>
<footer>© مؤسسة وصال التعليمية · إعداد: حسام الجنابي</footer>

<script type="module">
import {LIVE, init, loadSite, profile, subscribePosts, joinClass, myMemberships, isPublicGrade, F, db, auth, ensureAnon, now, tsText, errText} from './assets/db.js';
/* ============ البيانات والاختيار ============ */
const PREVIEW = /[?&]preview\b/.test(location.search);
let D = (PREVIEW && store.get(DRAFT_KEY)) || window.SCHOOL;
window.P = null;
let MEMS = [], OWNER = null, postsSub = null, booted = false;
if(LIVE){ try{ await init(); D = await loadSite(); }catch(e){ console.error(e); D.loadError = true; } }
/* الكادر يرى كل شيء؛ وولي الأمر يرى المحتوى العام ومحتوى الصفوف التي دخلها برمز */
async function startPosts(){
  if(postsSub) postsSub.stop();
  postsSub = subscribePosts({all: !!window.P, grades: MEMS.map(m => m.grade)}, posts => {
    Object.keys(SECTIONS).forEach(k => { if(Array.isArray(D[k])) D[k] = []; });
    posts.forEach(x => { if(Array.isArray(D[x.type])) D[x.type].push(x); });
    if(booted) refreshLive();
  });
  await postsSub.ready;
}
if(LIVE && !D.loadError){
  try{
    const p = await profile().catch(() => null);
    window.P = p && p.active ? p : null;
    if(!window.P){ await ensureAnon(); MEMS = await myMemberships().catch(() => []); }
    const o = await F.getDoc(F.doc(db, 'meta', 'owner')).catch(() => null);
    OWNER = o && o.exists() ? o.data().uid : null;
    await startPosts();
  }catch(e){ console.error(e); }
}
const liveVisitor = () => LIVE && !D.loadError && !window.P;
/* هل يرى الزائر محتوى صف معيّن؟ بلا قاعدة بيانات: نعم دائماً */
const canSee = g => !liveVisitor() || !g || isPublicGrade(g) || MEMS.some(m => m.grade === g);
let sel = store.get('wx2-sel') || {stage:'', grade:''};
if(sel.grade && !allGrades(D).includes(sel.grade)) sel = {stage:'', grade:''};
if(sel.stage && !D.stages.some(s => s.name === sel.stage)) sel = {stage:'', grade:''};
const forSel = it => matches(D, it.grade, sel);
const items = k => (D[k] || []).filter(forSel);
const selLabel = () => sel.grade ? 'الصف ' + sel.grade : sel.stage ? 'المرحلة ' + sel.stage : 'جميع المراحل';

/* ============ الرأس ============ */
const nm = D.school.name, m = nm.match(/^(.*?)\s+(الأهلية)$/);
$('#title').innerHTML = m ? `<span class="grad">${esc(m[1])}</span><br><span class="sub">${esc(m[2])}</span>` : `<span class="grad">${esc(nm)}</span>`;
$('#slogan').textContent = PREVIEW ? 'معاينة المسودة — لم تُنشر بعد' : (D.school.slogan || '');
document.title = 'بوابة ' + nm;
$('#today').textContent = fmtDate(todayISO()) + (D.school.year ? '  —  ' + D.school.year : '');
const founded = +D.school.founded || 0, age = new Date().getFullYear() - founded;
const STATS = [
  founded && [founded, 'سنة التأسيس', false],
  founded && [age, 'عاماً من العطاء', true],
  [D.stages.length, D.stages.length === 2 ? 'مرحلتان دراسيتان' : 'مراحل دراسية', true],
  [allGrades(D).length, 'صفاً دراسياً', true]
].filter(Boolean);
$('#stats').innerHTML = STATS.map(([n, l, cnt]) => `<div class="stat"><b data-n="${n}" data-c="${cnt ? 1 : 0}">${toAr(n)}</b><span>${l}</span></div>`).join('');
if(founded) $('#orb').innerHTML = orbSVG(founded);
/* عدّاد متحرك للأرقام */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) $$('#stats b[data-c="1"]').forEach(b => {
  const n = +b.dataset.n, t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 1200); b.textContent = toAr(Math.round(n * (1 - Math.pow(1 - p, 3)))); if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
});

function drawSel(){
  $('#stages').innerHTML = [['', 'كل المدرسة'], ...D.stages.map(s => [s.name, 'المرحلة ' + s.name])]
    .map(([v, l]) => `<button data-s="${esc(v)}" class="${v === sel.stage ? 'on' : ''}">${esc(l)}</button>`).join('');
  const st = D.stages.find(s => s.name === sel.stage);
  $('#grades').innerHTML = st ? [['', 'كل صفوف المرحلة'], ...st.grades.map(g => [g, g])]
    .map(([v, l]) => `<button data-g="${esc(v)}" class="${v === sel.grade ? 'on' : ''}">${esc(l)}</button>`).join('') : '<span class="muted">اختر المرحلة لعرض صفوفها، أو تصفّح محتوى المدرسة كلها.</span>';
}
$('#stages').onclick = e => { const b = e.target.closest('[data-s]'); if(!b) return; sel = {stage:b.dataset.s, grade:''}; store.set('wx2-sel', sel); drawSel(); route(); };
$('#grades').onclick = e => { const b = e.target.closest('[data-g]'); if(!b) return; sel.grade = b.dataset.g; store.set('wx2-sel', sel); drawSel(); route(); };
$('#nav').innerHTML = `<a href="#home" data-k="home">🏠 الرئيسية</a>` + Object.entries(SECTIONS).map(([k, s]) => `<a href="#${k}" data-k="${k}">${s.icon} ${s.label}</a>`).join('');
drawSel();

/* ============ البطاقات ============ */
const G = k => SECTIONS[k].glow;
const tags = it => `${it.subject ? `<span class="tag">${esc(it.subject)}</span>` : ''}<span class="tag">${esc(audienceLabel(it.grade))}</span>`;
const isNew = it => { const d = dayDiff(it.date); return d !== null && d <= 0 && d >= -2; };
const linkBtn = (url, text, cls='pri') => {
  if(!url) return '';
  const ext = /^https?:/.test(url) && !url.startsWith(location.origin);
  return `<a class="btn ${cls}" href="${esc(url)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
};
const calBox = iso => `<div class="cal"><div class="d">${fmtDate(iso, {day:'numeric'})}</div><div class="m">${fmtDate(iso, {month:'long'})}</div></div>`;
const CARD = {
  announcements: it => `
    <article class="card${it.urgent ? ' feat' : ''}" style="--g:${G('announcements')}">
      <h3>${esc(it.title)}</h3>
      <div class="meta">${it.urgent ? '<span class="tag hot">عاجل</span>' : ''}${isNew(it) ? '<span class="tag new">جديد</span>' : ''}
        <span class="tag">${esc(audienceLabel(it.grade))}</span><span class="muted">${fmtDate(it.date)}</span></div>
      <div class="body">${rich(it.body)}</div>
    </article>`,
  homework: it => {
    const d = dayDiff(it.due), late = d !== null && d < 0;
    const due = it.due ? `<span class="tag ${late ? 'late' : d <= 1 ? 'hot' : 'ok'}">${late ? 'انتهى موعد التسليم' : 'التسليم ' + relDay(d)}</span>` : '';
    return `
    <article class="card" style="--g:${G('homework')}">
      <h3>${esc(it.title)}</h3>
      <div class="meta">${isNew(it) ? '<span class="tag new">جديد</span>' : ''}${tags(it)}${due}</div>
      <div class="body">${rich(it.body)}</div>
      <div class="muted">أُعطي ${fmtDate(it.date)}${it.due ? '، وآخر موعد ' + fmtDate(it.due) : ''}</div>
      <div class="acts">${linkBtn(it.link, (it.examId || /#exam=/.test(it.link)) ? '✏️ حلّ الواجب الآن' : 'فتح الرابط')}</div>
    </article>`;
  },
  exams: it => {
    const d = dayDiff(it.date), open = d !== null && d <= 0;
    return `
    <article class="card" style="--g:${G('exams')}">
      <div class="evt">${calBox(it.date)}
        <div style="flex:1">
          <h3>${esc(it.title)}</h3>
          <div class="meta">${tags(it)}<span class="tag ${d < 0 ? '' : d === 0 ? 'hot' : 'ok'}">${d < 0 ? 'انتهى' : relDay(d)}</span></div>
          <div class="muted">${fmtDate(it.date)}</div>
          ${it.body ? `<div class="body">${rich(it.body)}</div>` : ''}
          <div class="acts">${it.link ? (open ? linkBtn(it.link, '📝 ادخل الامتحان') : `<span class="btn off">يُفتح ${relDay(d)}</span>`) : ''}</div>
        </div>
      </div>
    </article>`;
  },
  lessons: it => {
    const yt = ytId(it.link), icon = {'فيديو':'🎬', 'درس تفاعلي':'🧩', 'ملف':'📄'}[it.kind] || '🔗';
    return `
    <article class="card" style="--g:${G('lessons')}">
      <h3>${icon} ${esc(it.title)}</h3>
      <div class="meta">${isNew(it) ? '<span class="tag new">جديد</span>' : ''}${tags(it)}${it.kind ? `<span class="tag">${esc(it.kind)}</span>` : ''}</div>
      <div class="body">${rich(it.body)}</div>
      <div class="acts">${yt ? `<a class="btn pri" href="#lesson-${esc(it.id)}">▶ شاهد الدرس</a>` : linkBtn(it.link, 'افتح الدرس')}</div>
    </article>`;
  },
  events: it => {
    const d = dayDiff(it.date);
    return `
    <article class="card evt" style="--g:${G('events')}">${calBox(it.date)}
      <div style="flex:1">
        <h3>${esc(it.title)}</h3>
        <div class="meta"><span class="tag ${d === 0 ? 'hot' : d > 0 ? 'ok' : ''}">${relDay(d)}</span>${it.place ? `<span class="tag">📍 ${esc(it.place)}</span>` : ''}<span class="tag">${esc(audienceLabel(it.grade))}</span></div>
        <div class="muted">${fmtDate(it.date)}</div>
        ${it.body ? `<div class="body">${rich(it.body)}</div>` : ''}
      </div>
    </article>`;
  },
  activities: it => `
    <article class="card" style="--g:${G('activities')}">
      ${it.image ? `<img class="thumb" src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy">` : ''}
      <h3>${esc(it.title)}</h3>
      <div class="meta"><span class="tag">${esc(audienceLabel(it.grade))}</span><span class="muted">${fmtDate(it.date)}</span></div>
      <div class="body">${rich(it.body)}</div>
      <div class="acts">${linkBtn(it.link, 'المزيد', '')}</div>
    </article>`
};
const by = (f, dir=1) => (a, b) => dir * String(a[f] || '').localeCompare(String(b[f] || ''));
const SORT = {
  announcements: (a, b) => (!!b.urgent - !!a.urgent) || by('date', -1)(a, b),
  homework: (a, b) => { const la = dayDiff(a.due) < 0, lb = dayDiff(b.due) < 0; return la - lb || (la ? by('due', -1) : by('due'))(a, b); },
  exams: (a, b) => { const pa = dayDiff(a.date) < 0, pb = dayDiff(b.date) < 0; return pa - pb || (pa ? by('date', -1) : by('date'))(a, b); },
  lessons: by('date', -1), events: by('date'), activities: by('date', -1)
};
const emptyBox = t => `<div class="empty">${t}</div>`;
const listOf = (k, arr) => arr.length ? `<div class="list">${arr.map(CARD[k]).join('')}</div>` : emptyBox(`لا توجد ${SECTIONS[k].label} لـ${esc(selLabel())} حالياً.`);
const head = (k, t) => `<h2 class="sec" style="--g:${G(k)}">${SECTIONS[k].icon} ${t}</h2>`;

/* ============ الصفحات ============ */
function home(){
  theme('home');
  const upcoming = (k, f='date') => items(k).filter(x => dayDiff(x[f] || x.date) >= 0);
  const urgent = items('announcements').filter(a => a.urgent && dayDiff(a.date) >= -14).sort(SORT.announcements).slice(0, 3);
  const hw = upcoming('homework', 'due').sort(SORT.homework).slice(0, 4);
  const ex = upcoming('exams').sort(SORT.exams).slice(0, 3);
  const ev = upcoming('events').sort(SORT.events).slice(0, 3);
  const ann = items('announcements').filter(a => !urgent.includes(a)).sort(SORT.announcements).slice(0, 3);
  const les = items('lessons').sort(SORT.lessons).slice(0, 3);
  const count = k => k === 'contact' ? (D.staff || []).length : k === 'events' ? ev.length : items(k).length;
  return `
    ${PREVIEW ? '<div class="notice">أنت تشاهد معاينة المسودة المحفوظة في لوحة الإدارة على هذا الجهاز. لن يراها الآخرون قبل رفع ملف المحتوى.</div>' : ''}
    ${urgent.map(a => `<div class="urgent fade"><span class="node"></span><div><b>${esc(a.title)}</b> <span class="tag" style="color:#fff">${esc(audienceLabel(a.grade))}</span><div>${rich(a.body)}</div></div></div>`).join('')}
    ${homeClasses()}
    <div class="tiles">${Object.entries(SECTIONS).map(([k, s]) => `
      <a class="tile fade" href="#${k}" style="--c:${s.c};--g:${s.glow}"><div class="ic">${s.icon}</div><b>${s.label}</b><span class="cnt">${toAr(count(k))}</span></a>`).join('')}
    </div>
    <div class="cols">
      <div>${head('homework', 'واجبات قريبة')}${hw.length ? `<div class="list">${hw.map(CARD.homework).join('')}</div>` : emptyBox('لا توجد واجبات قادمة.')}</div>
      <div>${head('exams', 'امتحانات قادمة')}${ex.length ? `<div class="list">${ex.map(CARD.exams).join('')}</div>` : emptyBox('لا توجد امتحانات قادمة.')}</div>
    </div>
    <div class="cols">
      <div>${head('announcements', 'آخر التبليغات')}${ann.length ? `<div class="list">${ann.map(CARD.announcements).join('')}</div>` : emptyBox('لا توجد تبليغات أخرى.')}</div>
      <div>${head('events', 'المناسبات القادمة')}${ev.length ? `<div class="list">${ev.map(CARD.events).join('')}</div>` : emptyBox('لا توجد مناسبات قادمة.')}</div>
    </div>
    ${head('lessons', 'أحدث الدروس')}${listOf('lessons', les)}`;
}
function section(k){
  theme(k);
  const s = SECTIONS[k], hasSub = ['homework', 'exams', 'lessons'].includes(k);
  const st = store.get('wx2-f-' + k) || {};
  const subs = subjectsFor(D, sel.grade || (sel.stage ? STAGE_P + sel.stage : ''));
  return `
    ${head(k, s.label + ` <span class="muted" style="font-weight:700">· ${esc(selLabel())}</span>`)}
    ${liveVisitor() && hasSub && (sel.grade ? !canSee(sel.grade) : !MEMS.length) ? `<div class="notice">لرؤية ${s.label} صف ابنك ادخل برمز الصف. <a class="btn sm pri" href="#join${sel.grade ? '-' + chKeyOf(sel.grade) : ''}">🔑 دخول برمز الصف</a></div>` : ''}
    <div class="filters">
      <input id="q" placeholder="ابحث في ${s.label}…" value="${esc(st.q || '')}" aria-label="بحث">
      ${hasSub ? `<select id="sub" aria-label="المادة"><option value="">كل المواد</option>${subs.map(x => `<option${st.sub === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>` : '<span></span>'}
    </div>
    <div id="res"></div>`;
}
function fillSection(k){
  const run = () => {
    const q = $('#q').value.trim(), sub = $('#sub')?.value || '';
    store.set('wx2-f-' + k, {q, sub});
    const arr = items(k).filter(it => (!sub || it.subject === sub) && (!q || (it.title + ' ' + (it.body || '')).includes(q))).sort(SORT[k]);
    if(k === 'events'){
      const up = arr.filter(e => dayDiff(e.date) >= 0), past = arr.filter(e => dayDiff(e.date) < 0).reverse();
      $('#res').innerHTML = (up.length ? `<div class="list">${up.map(CARD.events).join('')}</div>` : emptyBox('لا توجد مناسبات قادمة.')) +
        (past.length ? `${head('events', 'مناسبات سابقة')}<div class="list" style="opacity:.75">${past.map(CARD.events).join('')}</div>` : '');
    } else $('#res').innerHTML = listOf(k, arr);
  };
  $('#q').oninput = run; if($('#sub')) $('#sub').onchange = run; run();
}
function lesson(id){
  theme('lessons');
  const it = (D.lessons || []).find(l => l.id === id);
  if(!it) return emptyBox('الدرس غير موجود.');
  return `
    <a class="btn" href="#lessons">→ كل الدروس</a>
    ${head('lessons', esc(it.title))}
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(it.link)}" title="${esc(it.title)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="card" style="margin-top:14px;--g:${G('lessons')}"><div class="meta">${tags(it)}</div><div class="body">${rich(it.body)}</div></div>`;
}

/* ============ التواصل الخاص ============ */
const LEAD = /المشرف|مدير/;
const reach = s => s.whatsapp || s.telegram;

/* ============ الرسائل الخاصة داخل الموقع (مع قاعدة البيانات) ============ */
const myThreads = () => store.get('wx-threads') || [];
const keepThread = id => store.set('wx-threads', [id, ...myThreads().filter(x => x !== id)].slice(0, 20));
let chatUnsub = null;
function contactLive(){
  theme('contact');
  const st = sel.stage || stageOf(D, sel.grade);
  const staff = (D.staff || []).filter(s => !st || !s.stage || s.stage === st);
  return `
    ${head('contact', 'التواصل مع المدرسة')}
    <div class="cols">
      <div class="panel">
        <h3>🔒 رسالة خاصة جديدة</h3>
        <p class="muted" style="line-height:1.9">تصل رسالتك إلى الجهة التي تختارها داخل الموقع، وتحصل على <b>رمز محادثة</b> خاص تتابع به الرد. ويحق لإدارة المدرسة الاطلاع على الرسائل.</p>
        <form id="mf" class="grid">
          <div class="full"><label for="to">إلى</label><select id="to">${staff.map(s => `<option value="${esc(s.id)}">${esc(s.name)}${s.role ? ' — ' + esc(s.role) : ''}${s.subjects ? '، ' + esc(s.subjects) : ''}</option>`).join('') || '<option value="">لا توجد جهات تستقبل الرسائل بعد</option>'}</select></div>
          <div><label for="pn">اسم ولي الأمر</label><input id="pn" autocomplete="name" maxlength="80" required></div>
          <div><label for="sn">اسم التلميذ أو الطالب</label><input id="sn" maxlength="80" required></div>
          <div><label for="sg">الصف</label><select id="sg">${audienceOptions(D, sel.grade, {all:false, stages:false})}</select></div>
          <div><label for="ss">الشعبة</label><input id="ss" maxlength="20" placeholder="مثال: أ"></div>
          <div class="full"><label for="msg">الرسالة</label><textarea id="msg" maxlength="3000" required></textarea></div>
          <div id="err" class="full"></div>
          <div class="full"><button class="pri" id="send">إرسال الرسالة</button></div>
        </form>
      </div>
      <div>
        <div class="panel">
          <h3>💬 محادثاتي</h3>
          <div class="list" id="mine"><div class="muted">جارٍ التحميل…</div></div>
          <form id="cf" class="row" style="margin-top:12px">
            <input id="code" dir="ltr" placeholder="أدخل رمز المحادثة" style="flex:1;min-width:0" aria-label="رمز المحادثة">
            <button>فتح</button>
          </form>
        </div>
        <div class="card" style="--g:${G('contact')};margin-top:14px">
          <h3>🏫 ${esc(D.school.name)}</h3>
          <div class="body">${D.school.founded ? '✨ تأسست عام ' + toAr(D.school.founded) + '<br>' : ''}${D.school.address ? '📍 ' + esc(D.school.address) + '<br>' : ''}${D.school.phone ? '☎️ <span dir="ltr">' + esc(toAr(D.school.phone)) + '</span><br>' : ''}${D.school.hours ? '🕘 أوقات الدوام: ' + esc(D.school.hours) : ''}</div>
        </div>
      </div>
    </div>`;
}
async function wireContactLive(){
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim(), to = (D.staff || []).find(s => s.id === $('#to').value);
    if(!to) return $('#err').innerHTML = '<div class="alert">لا توجد جهة تستقبل الرسائل بعد.</div>';
    if(!v('#pn') || !v('#sn') || !v('#msg')) return $('#err').innerHTML = '<div class="alert">اكتب اسمك واسم التلميذ ونص الرسالة.</div>';
    const b = $('#send'); b.disabled = true;
    try{
      const u = await ensureAnon();
      const t = F.doc(F.collection(db, 'threads'));
      const w = F.writeBatch(db);
      w.set(t, {to: to.id, toName: to.name, parentUid: u.uid, parentName: v('#pn'), studentName: v('#sn'), grade: $('#sg').value, section: v('#ss'),
        createdAt: now(), updatedAt: now(), lastFrom: 'parent', unreadStaff: true, unreadParent: false, status: 'open'});

  const its = chItems(key), g = chGrade(key); if(its.length) markSeen(key, tsOf(its[its.length - 1]));
  $('#fol').onclick = () => { const f = follows(); store.set('wx-follow', f.includes(key) ? f.filter(x => x !== key) : [key, ...f]); route(); };
  $('#pin').onclick = e => { const a = e.target.closest('[data-pin]'); if(!a) return; e.preventDefault(); const m = $('#m-' + a.dataset.pin); if(m){ m.scrollIntoView({block:'center'}); m.classList.add('flash'); setTimeout(() => m.classList.remove('flash'), 1500); } };
  feed.onclick = async e => {
    const b = e.target.closest('[data-delmsg]'); if(!b) return;
    if(!await ask('حذف هذا المنشور من القناة؟', 'حذف')) return;
    try{ await F.deleteDoc(F.doc(db, 'posts', b.dataset.delmsg)); toast('حُذف'); }catch(x){ toast(errText(x)); }
  };
  if($('#pm')) $('#pm').onclick = () => privateMsg(g);
  const form = $('#cmp'); if(!form) return;
  if($('#ctype')) $('#ctype').onclick = e => {
    const b = e.target.closest('[data-ct]'); if(!b) return;
    form.dataset.type = b.dataset.ct; $$('#ctype button').forEach(x => x.classList.toggle('on', x === b));
    const hw = b.dataset.ct === 'homework';
    $('#hwf').hidden = !hw; $('#cpinw').style.display = hw ? 'none' : 'flex';
    $('#cbody').placeholder = hw ? 'تفاصيل الواجب…' : 'اكتب منشوراً في ' + chName(key) + '…';
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const hw = form.dataset.type === 'homework', v = id => $(id).value.trim();
    const body = v('#cbody'), link = v('#clink'), image = v('#cimg');
    if(hw && !v('#ctitle')) return $('#cerr').innerHTML = '<div class="alert">اكتب عنوان الواجب.</div>';
    if(!body) return $('#cerr').innerHTML = '<div class="alert">اكتب النص.</div>';
    if(/\s/.test(link + image)) return $('#cerr').innerHTML = '<div class="alert">الرابط يحتوي على مسافات.</div>';
    const b = $('#csend'); b.disabled = true;
    const base = {body, link, image, grade: g, public: isPublicGrade(g), date: todayISO(), authorUid: P.uid, authorName: P.name, createdAt: now(), updatedAt: now()};
    try{
      await F.setDoc(F.doc(F.collection(db, 'posts')), hw
        ? {...base, type: 'homework', title: v('#ctitle'), subject: $('#csub').value, due: $('#cdue').value}
        : {...base, type: 'channels', title: '', pinned: $('#cpin').checked});
      ['#cbody', '#clink', '#cimg', '#ctitle', '#cdue'].forEach(id => { if($(id)) $(id).value = ''; });
      if($('#cpin')) $('#cpin').checked = false; $('#cerr').innerHTML = '';
      toast(hw ? 'نُشر الواجب' : 'نُشر في القناة');
    }catch(x){ $('#cerr').innerHTML = `<div class="alert">${esc(errText(x))}</div>`; }
    b.disabled = false;
  };
}
/* الدخول برمز الصف */
function joinView(key){
  theme('channels');
  const g = key && key !== 'all' ? chGrade(key) : '';
  if(!liveVisitor()) return emptyBox('الدخول برمز الصف يعمل بعد ربط المنصة بقاعدة البيانات.');
  return `
    <div class="panel joinbox fade">
      <div class="joinic" aria-hidden="true">🔑</div>
      <h2>${g ? 'قناة الصف ' + esc(g) : 'الدخول إلى صف ابنك'}</h2>
      <p class="muted">اكتب رمز الصف الذي أرسلته لك المدرسة، فتفتح لك قناة الصف وواجباته وامتحاناته ودروسه. يُحفظ دخولك على هذا الجهاز.</p>
      <form id="jf" class="grid" style="grid-template-columns:1fr">
        <div><label for="jc">رمز الصف</label><input id="jc" class="codein" dir="ltr" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······" required></div>
        <div><label for="jp">اسم ولي الأمر</label><input id="jp" maxlength="80" autocomplete="name" required></div>
        <div><label for="js">اسم التلميذ أو الطالب</label><input id="js" maxlength="80" required></div>
        <div id="jerr"></div>
        <button class="pri" id="jgo">دخول الصف</button>
      </form>
    </div>`;
}
function wireJoin(){
  $('#jc').oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  $('#jf').onsubmit = async e => {
    e.preventDefault();
    const b = $('#jgo'); b.disabled = true; b.textContent = 'جارٍ التحقق…';
    try{
      const grade = await joinClass($('#jc').value, $('#jp').value, $('#js').value);
      MEMS = await myMemberships(); await startPosts();
      const key = chKeyOf(grade);
      store.set('wx-follow', [key, ...follows().filter(x => x !== key)]);
      sel = {stage: stageOf(D, grade), grade}; store.set('wx2-sel', sel); drawSel();
      toast('أهلاً بك في قناة الصف ' + grade);
      if(location.hash === '#ch-' + key) route(); else location.hash = 'ch-' + key;
    }catch(x){ b.disabled = false; b.textContent = 'دخول الصف'; $('#jerr').innerHTML = `<div class="alert">${esc(errText(x))}</div>`; }
  };
}
/* دردشة خاصة مع مشرف القنوات من داخل القناة */
function privateMsg(g){
  const m = MEMS.find(x => x.grade === g) || {};
  const ownerName = ((D.staff || []).find(s => s.id === OWNER) || {}).name || 'مشرف القنوات';
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-label="مراسلة خاصة">
    <h3 style="margin-top:0">💬 رسالة خاصة إلى ${esc(ownerName)}</h3>
    <p class="muted">لا يراها أحد في القناة. ستحصل على رمز محادثة تتابع به الرد.</p>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div><label for="pmp">اسم ولي الأمر</label><input id="pmp" maxlength="80" value="${esc(m.parentName || '')}"></div>
      <div><label for="pms">اسم التلميذ</label><input id="pms" maxlength="80" value="${esc(m.studentName || '')}"></div>
      <div class="full"><label for="pmt">الرسالة</label><textarea id="pmt" maxlength="3000"></textarea></div>
    </div>
    <div id="pme"></div>
    <div class="row" style="margin-top:12px"><button class="pri" id="pmsend">إرسال</button><button id="pmx">إلغاء</button></div></div>`;
  document.body.appendChild(w); $('#pmt').focus();
  $('#pmx').onclick = () => w.remove();
  $('#pmsend').onclick = async () => {
    const v = id => $(id).value.trim();
    if(!v('#pmp') || !v('#pms') || !v('#pmt')) return $('#pme').innerHTML = '<div class="alert">اكتب الاسمين والرسالة.</div>';
    $('#pmsend').disabled = true;
    try{
      const u = await ensureAnon(), t = F.doc(F.collection(db, 'threads')), b = F.writeBatch(db);
      b.set(t, {to: OWNER, toName: ownerName, parentUid: u.uid, parentName: v('#pmp'), studentName: v('#pms'), grade: g, section: '',
        createdAt: now(), updatedAt: now(), lastFrom: 'parent', unreadStaff: true, unreadParent: false, status: 'open'});
      b.set(F.doc(F.collection(db, 'threads', t.id, 'msgs')), {from: 'parent', text: v('#pmt'), at: now(), by: u.uid, byName: v('#pmp')});
      await b.commit(); keepThread(t.id); w.remove(); location.hash = 'chat-' + t.id;
    }catch(x){ $('#pmsend').disabled = false; $('#pme').innerHTML = `<div class="alert">${esc(errText(x))}</div>`; }
  };
}
/* صفوفي في الرئيسية */
function homeClasses(){
  if(liveVisitor()){
    const mine = MEMS.map(m => chKeyOf(m.grade)).filter(k => k !== '-1');
    if(!mine.length) return `
      <a class="card joincta fade" href="#join" style="--g:${G('channels')}">
        <div class="joinic" aria-hidden="true">🔑</div>
        <div><b>ادخل صف ابنك برمز الصف</b><div class="muted">تفتح لك قناة الصف وواجباته وامتحاناته ودروسه، ودردشة خاصة مع الإدارة.</div></div>
      </a>`;
    return `<h3 style="margin:4px 0 8px">⭐ صفوفي</h3><div class="list" style="margin-bottom:8px">${mine.map(chRow).join('')}</div><a class="btn sm" href="#join" style="margin-bottom:14px">+ إضافة صف آخر</a>`;
  }
  return sel.grade ? `<div class="list" style="margin-bottom:12px">${chRow(chKeyOf(sel.grade))}</div>` : '';
}
/* تحديث القنوات مباشرة عند نشر جديد (مع قاعدة البيانات) */
function refreshLive(){
  const h = location.hash.replace(/^#\/?/, '');
  if(h.startsWith('ch-')){
    const key = h.slice(3), feed = $('#feed'); if(!feed) return;
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    feed.innerHTML = feedHTML(key); $('#pin').innerHTML = pinHTML(key);
    if(atBottom) feed.scrollTop = feed.scrollHeight;
    const its = chItems(key); if(its.length) markSeen(key, tsOf(its[its.length - 1]));
  } else if(h === 'channels' || h === '' || h === 'home') route();
}

function route(){
  /* روابط بسيطة مثل #homework و #lesson-l1 (والصيغة القديمة #/homework ما زالت تعمل) */
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [k, id] = h.startsWith('lesson') ? ['lesson', h.replace(/^lesson[-/]/, '')] : [h.split('/')[0], ''];
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (k || 'home') || (k === 'lesson' && a.dataset.k === 'lessons') || (k.startsWith('chat-') && a.dataset.k === 'contact') || ((k.startsWith('ch-') || k.startsWith('join')) && a.dataset.k === 'channels')));
  const v = $('#view');
  if(chatUnsub){ chatUnsub(); chatUnsub = null; }
  if(k === 'contact'){ if(LIVE && !D.loadError){ v.innerHTML = contactLive(); wireContactLive(); } else { v.innerHTML = contact(); wireContact(); } }
  else if(LIVE && k.startsWith('chat-')){ v.innerHTML = chatView(k.slice(5)); wireChat(k.slice(5)); }
  else if(k === 'lesson') v.innerHTML = lesson(id);
  else if(k === 'channels') v.innerHTML = channelsView();
  else if(k === 'join' || k.startsWith('join-')){ v.innerHTML = joinView(k.slice(5)); if($('#jf')) wireJoin(); }
  else if(k.startsWith('ch-')){ v.innerHTML = channelView(k.slice(3)); wireChannel(k.slice(3)); }
  else if(CARD[k]){ v.innerHTML = section(k); fillSection(k); }
  else v.innerHTML = home();
  v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
  $('#nav a.on')?.scrollIntoView({inline:'center', block:'nearest'});
}
window.addEventListener('hashchange', () => { route(); window.scrollTo({top: $('.topnav').offsetTop, behavior:'smooth'}); });
booted = true;
route();
</script>
</body>
