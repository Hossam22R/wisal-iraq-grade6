<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<title>وطننا العراق — الدرس الأول</title>
<style>
@font-face{font-family:'Cairo';src:local('Cairo'),local('Cairo Regular'),local('Cairo-Regular');}
:root{--olive:#DCE9D5;--cream:#FBF5E6;--card:#F4E8CB;--green:#1F3B2D;--ink:#1A1511;--brown:#5B4326;--line:#8A6F45;--red:#7A1212;--gold:#B8860B;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Cairo',Tahoma,sans-serif;color:var(--ink);background:var(--olive);padding:14px;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1040px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:22px;color:var(--green)}
.tools{display:flex;gap:6px}
button{font-family:inherit;border:2px solid var(--line);background:var(--cream);color:var(--ink);padding:9px 14px;border-radius:12px;cursor:pointer;font-size:16px}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--green);color:var(--cream);border-color:var(--green)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.dots button{padding:5px 11px;font-size:14px;border-radius:20px}
.frame{position:relative;width:100%;max-width:1040px;min-height:540px;background:var(--cream);border:3px double var(--green);border-radius:18px;padding:26px;box-shadow:0 14px 30px rgba(31,59,45,.18);animation:enter .6s ease both}
.frame::before,.frame::after,.c2{content:"";position:absolute;width:16px;height:16px;background:var(--line);transform:rotate(45deg)}
.frame::before{top:-9px;right:-9px}.frame::after{bottom:-9px;left:-9px}
.c2{top:-9px;left:-9px}
h2{margin:0 0 6px;font-size:28px;color:var(--green)}
h3{margin:12px 0 6px;font-size:19px;color:var(--brown)}
p{margin:6px 0;line-height:1.9;font-size:18px}
.src{font-size:13px;color:var(--brown);margin-top:16px;border-top:1px dashed var(--line);padding-top:8px}
.glow{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,59,45,.18),0 0 14px 4px rgba(57,255,20,.45);margin-left:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.map{background:var(--olive);border:2px solid var(--line);border-radius:14px;padding:8px}
.map svg{width:100%;max-height:520px;display:block}
.nb{cursor:pointer}
.nb text{font-family:inherit;font-size:44px;fill:var(--ink)}
.nb:hover text{fill:var(--red);font-weight:700}
.rg{cursor:pointer;stroke:#4A3A28;stroke-width:3;transition:fill .6s,opacity .3s}
.rg:hover{opacity:.9}
.rg.hit{stroke:var(--gold);stroke-width:8}
.water{fill:#2F6F9A;opacity:.85;transition:opacity .6s}
.water.hi{opacity:1;filter:drop-shadow(0 0 6px #7fd3ff)}
.dam{cursor:pointer;transition:r .3s}
.dam:hover{r:26}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;min-height:70px;font-size:18px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:8px 14px;font-size:17px;cursor:pointer}
.chip.sel{background:var(--green);color:var(--cream);border-color:var(--green)}
.chip.done{background:#DCE9D5;border-color:var(--green)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.ok{color:var(--green);font-weight:700}
.bad{color:var(--red);font-weight:700}
.q{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.q button{display:block;width:100%;text-align:right;margin:5px 0;font-size:17px}
.timer{font-size:54px;font-weight:700;color:var(--red);text-align:center}
.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.player{background:var(--card);border:3px solid var(--green);border-radius:16px;padding:14px;text-align:center}
.player.live{background:#DCE9D5;box-shadow:0 0 0 4px rgba(57,255,20,.35)}
.player .pts{font-size:46px;font-weight:700;color:var(--green)}
.player button{width:100%;font-size:20px;padding:14px;margin-top:8px}
.slider{width:100%;accent-color:var(--red);margin-top:10px}
.zone{font-size:22px;font-weight:700;color:var(--green);margin-top:6px}
.stars{font-size:34px;letter-spacing:4px;color:var(--gold)}
.idcard{background:var(--cream);border:4px double var(--green);border-radius:18px;padding:22px;max-width:640px;margin:0 auto}
.idcard h3{text-align:center;font-size:24px;color:var(--green)}
.idcard li{margin:6px 0;font-size:17px;line-height:1.8}
.idcard ul{padding-right:20px}
.teach .frame p,.teach .info{font-size:24px}
.teach h2{font-size:34px}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.still *{animation:none!important;transition:none!important}
@media (max-width:760px){.grid2,.players{grid-template-columns:1fr}h2{font-size:23px}.frame{padding:18px}}
@media print{body{background:#fff;padding:0}body *{visibility:hidden}#idcard,#idcard *{visibility:visible}#idcard{position:absolute;left:0;top:0;width:100%;max-width:none}header,.dots,.ctrl,.src{display:none}}
</style>
</head>
<body>
<header>
  <h1>وطننا العراق · الدرس الأول</h1>
  <div class="tools">
    <button id="mute">🔊 الصوت</button>
    <button id="still">إيقاف الحركة</button>
    <button id="teach">وضع المعلم</button>
  </div>
</header>
<div class="dots" id="dots"></div>
<main class="frame" id="stage"><span class="c2"></span></main>
<div class="ctrl" style="display:flex;gap:10px;margin-top:14px;align-items:center">
  <button id="prev">→ السابق</button>
  <span id="prog" style="min-width:160px;text-align:center"></span>
  <button id="next">← التالي</button>
</div>

let ac = null, osc = null, gain = null, stopT = null, muted = false;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f){ if(muted) return; const c = audio(); if(!c) return;
  if(!osc){ osc = c.createOscillator(); gain = c.createGain(); gain.gain.value = 0; osc.type='sine'; osc.connect(gain).connect(c.destination); osc.start(); }
  osc.frequency.setTargetAtTime(f, c.currentTime, 0.03); gain.gain.setTargetAtTime(0.06, c.currentTime, 0.03);
  clearTimeout(stopT); stopT = setTimeout(silence, 1500); }
function silence(){ if(gain && ac) gain.gain.setTargetAtTime(0, ac.currentTime, 0.05); }
function blip(ok){ if(muted) return; const c = audio(); if(!c) return; const o = c.createOscillator(), g = c.createGain();
  o.type='triangle'; o.frequency.value = ok===false ? 220 : 660; g.gain.value = 0.05; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+0.18); }
$('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇 مكتوم' : '🔊 الصوت'; if(muted) silence(); };

$('#teach').onclick = () => { document.body.classList.toggle('teach'); $('#teach').classList.toggle('on'); };

  { q:'أي البحيرات التالية في العراق؟', o:['الثرثار','فكتوريا','تيتيكاكا'], a:0 },
  { q:'أين تقع الهضبة الغربية؟', o:['الشمال الشرقي','الغرب والجنوب الغربي','الشرق'], a:1 },
  { q:'في أي الأقسام يزداد سقوط الأمطار؟', o:['الجنوب','الشمال','الوسط فقط'], a:1 },
  { q:'متى يقتصر سقوط الأمطار غالباً؟', o:['الصيف','الشتاء','الربيع'], a:1 },
  { q:'أين ترتفع درجات الحرارة صيفاً؟', o:['في الأقسام الوسطى والجنوبية','في الأقسام الشمالية فقط','في الجبال فقط'], a:0 },
  { q:'ما اسم الحضارة التي نشأت في وسط العراق؟', o:['البابلية','الفرعونية','الهندية'], a:0 },
  { q:'من وضع القوانين المشهورة في بلاد الرافدين؟', o:['حمورابي','نبوخذ نصر','الإسكندر'], a:0 }
];
screens.push({ title:'جولة السرعة', render(el){
  const st = { q:0, s:[0,0], phase:'buzz', owner:null, left:12, iv:null, tried:false };
  el.innerHTML = `
    <h2>جولة السرعة</h2>
    <p>تلميذان، والعداد لكل سؤال. من يضغط زره أولاً يجيب، فإن أخطأ انتقل السؤال للتلميذ الآخر.</p>
    <div class="players">
      <div class="player" id="pl0"><div>التلميذ الأول</div><div class="pts" id="p0">٠</div><button id="b0">اضغط أولاً</button></div>
      <div class="player" id="pl1"><div>التلميذ الثاني</div><div class="pts" id="p1">٠</div><button id="b1">اضغط أولاً</button></div>
    </div>
    <div class="timer" id="tm">١٢</div>
    <div class="box" id="qbox"></div>
    <div class="src">المصدر: كتاب الاجتماعيات للصف السادس الابتدائي، وزارة التربية</div>`;
  function clearT(){ clearInterval(st.iv); st.iv = null; }
  function startT(){ clearT(); st.left = 12; $('#tm').textContent = toAr(st.left);
    st.iv = setInterval(() => { st.left--; $('#tm').textContent = toAr(st.left);
      if(st.left <= 0){ clearT(); blip(false); $('#qbox').innerHTML = '<span class="bad">انتهى الوقت.</span>'; setTimeout(next, 1200); } }, 1000); }
  function showQ(){ const item = SP[st.q]; st.phase='buzz'; st.owner=null; st.tried=false;
    $('#qbox').innerHTML = `<p><b>${toAr(st.q+1)}.</b> ${item.q}</p>`;
    $('#b0').disabled = false; $('#b1').disabled = false; $('#pl0').classList.remove('live'); $('#pl1').classList.remove('live'); startT(); }
  function offer(side){ st.owner = side; st.phase='answer'; $('#pl'+side).classList.add('live'); $('#b0').disabled=true; $('#b1').disabled=true;
    const item = SP[st.q]; const box = $('#qbox');
    box.innerHTML = `<p><b>${toAr(st.q+1)}.</b> ${item.q}</p><p>الدور: <b>${side===0?'التلميذ الأول':'التلميذ الثاني'}</b></p>`;
    item.o.forEach((opt,j) => { const b = document.createElement('button'); b.textContent = opt; b.onclick = () => answer(j); box.appendChild(b); }); }
  function answer(j){ const item = SP[st.q]; clearT();
    if(j === item.a){ st.s[st.owner]++; blip(true); $('#qbox').insertAdjacentHTML('beforeend','<p class="ok">إجابة صحيحة، نقطة لصالح التلميذ.</p>'); $('#p'+st.owner).textContent = toAr(st.s[st.owner]); setTimeout(next, 1400); }
    else { blip(false); $('#qbox').insertAdjacentHTML('beforeend','<p class="bad">إجابة خاطئة.</p>');
      if(!st.tried){ st.tried = true; const other = 1 - st.owner;
        setTimeout(() => { $('#qbox').innerHTML = `<p><b>${toAr(st.q+1)}.</b> ${item.q}</p><p>الدور للتلميذ الآخر.</p><button id="ob">اضغط للإجابة</button>`;
          $('#pl'+st.owner).classList.remove('live'); $('#ob').onclick = () => offer(other); startT(); }, 1200); }
      else setTimeout(next, 1200); } }
  function next(){ st.q++; if(st.q >= SP.length){ clearT();
      const w = st.s[0]===st.s[1] ? 'تعادل' : (st.s[0] > st.s[1] ? 'فاز التلميذ الأول' : 'فاز التلميذ الثاني');
      $('#qbox').innerHTML = `<h3>النتيجة</h3><p>${toAr(st.s[0])} : ${toAr(st.s[1])} — ${w}.</p><button id="again">جولة جديدة</button>`;
      $('#tm').textContent = '—'; $('#b0').disabled = true; $('#b1').disabled = true; $('#again').onclick = () => render(cur); return; }
    showQ(); }
  $('#b0').onclick = () => { if(st.phase==='buzz'){ blip(true); offer(0); } };
  $('#b1').onclick = () => { if(st.phase==='buzz'){ blip(true); offer(1); } };
  showQ();
}});

/* ---------- التنقّل ---------- */
let cur = 0;
const stage = $('#stage');
function render(n){
  cur = n;
  stage.innerHTML = '<span class="c2"></span>';
  const wrap = document.createElement('div'); stage.appendChild(wrap);
  screens[cur].render(wrap);
  document.querySelectorAll('#dots button').forEach((b,i) => b.classList.toggle('on', i===cur));
  $('#prev').disabled = cur===0; $('#next').disabled = cur===screens.length-1;
  $('#prog').textContent = `${toAr(cur+1)} من ${toAr(screens.length)} · ${screens[cur].title}`;
  silence(); window.scrollTo({top:0,behavior:'smooth'});
}
screens.forEach((s,i) => { const b = document.createElement('button'); b.textContent = toAr(i+1); b.onclick = () => render(i); $('#dots').appendChild(b); });
$('#next').onclick = () => render(Math.min(cur+1, screens.length-1));
$('#prev').onclick = () => render(Math.max(cur-1, 0));
document.addEventListener('keydown', e => { if(e.key==='ArrowLeft') render(Math.min(cur+1, screens.length-1)); if(e.key==='ArrowRight') render(Math.max(cur-1, 0)); });
render(0);
</script>
