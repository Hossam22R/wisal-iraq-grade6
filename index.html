<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1220">
<title>بوابة مدارس براعم كربلاء الأهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<script src="data/content.js"></script>
</head>
<body>
<section class="hero">
  <div class="wrap hero-in">
    <div>
      <div class="chip-live"><span class="node"></span><span id="today"></span></div>
      <h1 id="title"></h1>
      <p id="slogan"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="orb" id="orb"></div>
  </div>
  <div class="wrap">
    <div class="selector" aria-label="اختر المرحلة والصف">
      <div class="seg" id="stages"></div>
      <div class="chips" id="grades"></div>
    </div>
  </div>
</section>
<nav class="topnav" aria-label="أقسام البوابة"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="view"></main>
<footer>© مؤسسة وصال التعليمية · إعداد: حسام الجنابي</footer>

<script>
/* ============ البيانات والاختيار ============ */
const PREVIEW = /[?&]preview\b/.test(location.search);
const D = (PREVIEW && store.get(DRAFT_KEY)) || window.SCHOOL;
let sel = store.get('wx2-sel') || {stage:'', grade:''};
if(sel.grade && !allGrades(D).includes(sel.grade)) sel = {stage:'', grade:''};
if(sel.stage && !D.stages.some(s => s.name === sel.stage)) sel = {stage:'', grade:''};
const forSel = it => matches(D, it.grade, sel);
const items = k => (D[k] || []).filter(forSel);
const selLabel = () => sel.grade ? 'الصف ' + sel.grade : sel.stage ? 'المرحلة ' + sel.stage : 'جميع المراحل';

/* ============ الرأس ============ */
const nm = D.school.name, m = nm.match(/^(.*?)\s+(الأهلية)$/);
$('#title').innerHTML = m ? `<span class="grad">${esc(m[1])}</span><br><span class="sub">${esc(m[2])}</span>` : `<span class="grad">${esc(nm)}</span>`;
$('#slogan').textContent = PREVIEW ? 'معاينة المسودة — لم تُنشر بعد' : (D.school.slogan || '');
document.title = 'بوابة ' + nm;
$('#today').textContent = fmtDate(todayISO()) + (D.school.year ? '  —  ' + D.school.year : '');
const founded = +D.school.founded || 0, age = new Date().getFullYear() - founded;
const STATS = [
  founded && [founded, 'سنة التأسيس', false],
  founded && [age, 'عاماً من العطاء', true],
  [D.stages.length, D.stages.length === 2 ? 'مرحلتان دراسيتان' : 'مراحل دراسية', true],
  [allGrades(D).length, 'صفاً دراسياً', true]
].filter(Boolean);
$('#stats').innerHTML = STATS.map(([n, l, cnt]) => `<div class="stat"><b data-n="${n}" data-c="${cnt ? 1 : 0}">${toAr(n)}</b><span>${l}</span></div>`).join('');
if(founded) $('#orb').innerHTML = orbSVG(founded);
/* عدّاد متحرك للأرقام */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) $$('#stats b[data-c="1"]').forEach(b => {
  const n = +b.dataset.n, t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 1200); b.textContent = toAr(Math.round(n * (1 - Math.pow(1 - p, 3)))); if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
});

function drawSel(){
  $('#stages').innerHTML = [['', 'كل المدرسة'], ...D.stages.map(s => [s.name, 'المرحلة ' + s.name])]
    .map(([v, l]) => `<button data-s="${esc(v)}" class="${v === sel.stage ? 'on' : ''}">${esc(l)}</button>`).join('');
  const st = D.stages.find(s => s.name === sel.stage);
  $('#grades').innerHTML = st ? [['', 'كل صفوف المرحلة'], ...st.grades.map(g => [g, g])]
    .map(([v, l]) => `<button data-g="${esc(v)}" class="${v === sel.grade ? 'on' : ''}">${esc(l)}</button>`).join('') : '<span class="muted">اختر المرحلة لعرض صفوفها، أو تصفّح محتوى المدرسة كلها.</span>';
}
$('#stages').onclick = e => { const b = e.target.closest('[data-s]'); if(!b) return; sel = {stage:b.dataset.s, grade:''}; store.set('wx2-sel', sel); drawSel(); route(); };
$('#grades').onclick = e => { const b = e.target.closest('[data-g]'); if(!b) return; sel.grade = b.dataset.g; store.set('wx2-sel', sel); drawSel(); route(); };
$('#nav').innerHTML = `<a href="#home" data-k="home">🏠 الرئيسية</a>` + Object.entries(SECTIONS).map(([k, s]) => `<a href="#${k}" data-k="${k}">${s.icon} ${s.label}</a>`).join('');
drawSel();

/* ============ البطاقات ============ */
const G = k => SECTIONS[k].glow;
const tags = it => `${it.subject ? `<span class="tag">${esc(it.subject)}</span>` : ''}<span class="tag">${esc(audienceLabel(it.grade))}</span>`;
const isNew = it => { const d = dayDiff(it.date); return d !== null && d <= 0 && d >= -2; };
const linkBtn = (url, text, cls='pri') => {
  if(!url) return '';
  const ext = /^https?:/.test(url) && !url.startsWith(location.origin);
  return `<a class="btn ${cls}" href="${esc(url)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
};
const calBox = iso => `<div class="cal"><div class="d">${fmtDate(iso, {day:'numeric'})}</div><div class="m">${fmtDate(iso, {month:'long'})}</div></div>`;
const CARD = {
  announcements: it => `
    <article class="card${it.urgent ? ' feat' : ''}" style="--g:${G('announcements')}">
      <h3>${esc(it.title)}</h3>
      <div class="meta">${it.urgent ? '<span class="tag hot">عاجل</span>' : ''}${isNew(it) ? '<span class="tag new">جديد</span>' : ''}
        <span class="tag">${esc(audienceLabel(it.grade))}</span><span class="muted">${fmtDate(it.date)}</span></div>
      <div class="body">${rich(it.body)}</div>
    </article>`,
  homework: it => {
    const d = dayDiff(it.due), late = d !== null && d < 0;
    const due = it.due ? `<span class="tag ${late ? 'late' : d <= 1 ? 'hot' : 'ok'}">${late ? 'انتهى موعد التسليم' : 'التسليم ' + relDay(d)}</span>` : '';
    return `
    <article class="card" style="--g:${G('homework')}">
      <h3>${esc(it.title)}</h3>
      <div class="meta">${isNew(it) ? '<span class="tag new">جديد</span>' : ''}${tags(it)}${due}</div>
      <div class="body">${rich(it.body)}</div>
      <div class="muted">أُعطي ${fmtDate(it.date)}${it.due ? '، وآخر موعد ' + fmtDate(it.due) : ''}</div>
      <div class="acts">${linkBtn(it.link, /#exam=/.test(it.link) ? '✏️ حلّ الواجب الآن' : 'فتح الرابط')}</div>
    </article>`;
  },
  exams: it => {
    const d = dayDiff(it.date), open = d !== null && d <= 0;
    return `
    <article class="card" style="--g:${G('exams')}">
      <div class="evt">${calBox(it.date)}
        <div style="flex:1">
          <h3>${esc(it.title)}</h3>
          <div class="meta">${tags(it)}<span class="tag ${d < 0 ? '' : d === 0 ? 'hot' : 'ok'}">${d < 0 ? 'انتهى' : relDay(d)}</span></div>
          <div class="muted">${fmtDate(it.date)}</div>
          ${it.body ? `<div class="body">${rich(it.body)}</div>` : ''}
          <div class="acts">${it.link ? (open ? linkBtn(it.link, '📝 ادخل الامتحان') : `<span class="btn off">يُفتح ${relDay(d)}</span>`) : ''}</div>
        </div>
      </div>
    </article>`;
  },
  lessons: it => {
    const yt = ytId(it.link), icon = {'فيديو':'🎬', 'درس تفاعلي':'🧩', 'ملف':'📄'}[it.kind] || '🔗';
    return `
    <article class="card" style="--g:${G('lessons')}">
      <h3>${icon} ${esc(it.title)}</h3>
      <div class="meta">${isNew(it) ? '<span class="tag new">جديد</span>' : ''}${tags(it)}${it.kind ? `<span class="tag">${esc(it.kind)}</span>` : ''}</div>
      <div class="body">${rich(it.body)}</div>
      <div class="acts">${yt ? `<a class="btn pri" href="#lesson-${esc(it.id)}">▶ شاهد الدرس</a>` : linkBtn(it.link, 'افتح الدرس')}</div>
    </article>`;
  },
  events: it => {
    const d = dayDiff(it.date);
    return `
    <article class="card evt" style="--g:${G('events')}">${calBox(it.date)}
      <div style="flex:1">
        <h3>${esc(it.title)}</h3>
        <div class="meta"><span class="tag ${d === 0 ? 'hot' : d > 0 ? 'ok' : ''}">${relDay(d)}</span>${it.place ? `<span class="tag">📍 ${esc(it.place)}</span>` : ''}<span class="tag">${esc(audienceLabel(it.grade))}</span></div>
        <div class="muted">${fmtDate(it.date)}</div>
        ${it.body ? `<div class="body">${rich(it.body)}</div>` : ''}
      </div>
    </article>`;
  },
  activities: it => `
    <article class="card" style="--g:${G('activities')}">
      ${it.image ? `<img class="thumb" src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy">` : ''}
      <h3>${esc(it.title)}</h3>
      <div class="meta"><span class="tag">${esc(audienceLabel(it.grade))}</span><span class="muted">${fmtDate(it.date)}</span></div>
      <div class="body">${rich(it.body)}</div>
      <div class="acts">${linkBtn(it.link, 'المزيد', '')}</div>
    </article>`
};
const by = (f, dir=1) => (a, b) => dir * String(a[f] || '').localeCompare(String(b[f] || ''));
const SORT = {
  announcements: (a, b) => (!!b.urgent - !!a.urgent) || by('date', -1)(a, b),
  homework: (a, b) => { const la = dayDiff(a.due) < 0, lb = dayDiff(b.due) < 0; return la - lb || (la ? by('due', -1) : by('due'))(a, b); },
  exams: (a, b) => { const pa = dayDiff(a.date) < 0, pb = dayDiff(b.date) < 0; return pa - pb || (pa ? by('date', -1) : by('date'))(a, b); },
  lessons: by('date', -1), events: by('date'), activities: by('date', -1)
};
const emptyBox = t => `<div class="empty">${t}</div>`;
const listOf = (k, arr) => arr.length ? `<div class="list">${arr.map(CARD[k]).join('')}</div>` : emptyBox(`لا توجد ${SECTIONS[k].label} لـ${esc(selLabel())} حالياً.`);
const head = (k, t) => `<h2 class="sec" style="--g:${G(k)}">${SECTIONS[k].icon} ${t}</h2>`;

/* ============ الصفحات ============ */
function home(){
  theme('home');
  const upcoming = (k, f='date') => items(k).filter(x => dayDiff(x[f] || x.date) >= 0);
  const urgent = items('announcements').filter(a => a.urgent && dayDiff(a.date) >= -14).sort(SORT.announcements).slice(0, 3);
  const hw = upcoming('homework', 'due').sort(SORT.homework).slice(0, 4);
  const ex = upcoming('exams').sort(SORT.exams).slice(0, 3);
  const ev = upcoming('events').sort(SORT.events).slice(0, 3);
  const ann = items('announcements').filter(a => !urgent.includes(a)).sort(SORT.announcements).slice(0, 3);
  const les = items('lessons').sort(SORT.lessons).slice(0, 3);
  const count = k => k === 'contact' ? (D.staff || []).length : k === 'events' ? ev.length : items(k).length;
  return `
    ${PREVIEW ? '<div class="notice">أنت تشاهد معاينة المسودة المحفوظة في لوحة الإدارة على هذا الجهاز. لن يراها الآخرون قبل رفع ملف المحتوى.</div>' : ''}
    ${urgent.map(a => `<div class="urgent fade"><span class="node"></span><div><b>${esc(a.title)}</b> <span class="tag" style="color:#fff">${esc(audienceLabel(a.grade))}</span><div>${rich(a.body)}</div></div></div>`).join('')}
    <div class="tiles">${Object.entries(SECTIONS).map(([k, s]) => `
      <a class="tile fade" href="#${k}" style="--c:${s.c};--g:${s.glow}"><div class="ic">${s.icon}</div><b>${s.label}</b><span class="cnt">${toAr(count(k))}</span></a>`).join('')}
    </div>
    <div class="cols">
      <div>${head('homework', 'واجبات قريبة')}${hw.length ? `<div class="list">${hw.map(CARD.homework).join('')}</div>` : emptyBox('لا توجد واجبات قادمة.')}</div>
      <div>${head('exams', 'امتحانات قادمة')}${ex.length ? `<div class="list">${ex.map(CARD.exams).join('')}</div>` : emptyBox('لا توجد امتحانات قادمة.')}</div>
    </div>
    <div class="cols">
      <div>${head('announcements', 'آخر التبليغات')}${ann.length ? `<div class="list">${ann.map(CARD.announcements).join('')}</div>` : emptyBox('لا توجد تبليغات أخرى.')}</div>
      <div>${head('events', 'المناسبات القادمة')}${ev.length ? `<div class="list">${ev.map(CARD.events).join('')}</div>` : emptyBox('لا توجد مناسبات قادمة.')}</div>
    </div>
    ${head('lessons', 'أحدث الدروس')}${listOf('lessons', les)}`;
}
function section(k){
  theme(k);
  const s = SECTIONS[k], hasSub = ['homework', 'exams', 'lessons'].includes(k);
  const st = store.get('wx2-f-' + k) || {};
  const subs = subjectsFor(D, sel.grade || (sel.stage ? STAGE_P + sel.stage : ''));
  return `
    ${head(k, s.label + ` <span class="muted" style="font-weight:700">· ${esc(selLabel())}</span>`)}
    <div class="filters">
      <input id="q" placeholder="ابحث في ${s.label}…" value="${esc(st.q || '')}" aria-label="بحث">
      ${hasSub ? `<select id="sub" aria-label="المادة"><option value="">كل المواد</option>${subs.map(x => `<option${st.sub === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>` : '<span></span>'}
    </div>
    <div id="res"></div>`;
}
function fillSection(k){
  const run = () => {
    const q = $('#q').value.trim(), sub = $('#sub')?.value || '';
    store.set('wx2-f-' + k, {q, sub});
    const arr = items(k).filter(it => (!sub || it.subject === sub) && (!q || (it.title + ' ' + (it.body || '')).includes(q))).sort(SORT[k]);
    if(k === 'events'){
      const up = arr.filter(e => dayDiff(e.date) >= 0), past = arr.filter(e => dayDiff(e.date) < 0).reverse();
      $('#res').innerHTML = (up.length ? `<div class="list">${up.map(CARD.events).join('')}</div>` : emptyBox('لا توجد مناسبات قادمة.')) +
        (past.length ? `${head('events', 'مناسبات سابقة')}<div class="list" style="opacity:.75">${past.map(CARD.events).join('')}</div>` : '');
    } else $('#res').innerHTML = listOf(k, arr);
  };
  $('#q').oninput = run; if($('#sub')) $('#sub').onchange = run; run();
}
function lesson(id){
  theme('lessons');
  const it = (D.lessons || []).find(l => l.id === id);
  if(!it) return emptyBox('الدرس غير موجود.');
  return `
    <a class="btn" href="#lessons">→ كل الدروس</a>
    ${head('lessons', esc(it.title))}
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(it.link)}" title="${esc(it.title)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="card" style="margin-top:14px;--g:${G('lessons')}"><div class="meta">${tags(it)}</div><div class="body">${rich(it.body)}</div></div>`;
}

/* ============ التواصل الخاص ============ */
const LEAD = /المشرف|مدير/;
const reach = s => s.whatsapp || s.telegram;
function contact(){
  theme('contact');
  const sc = D.school, st = sel.stage || stageOf(D, sel.grade);
  const staff = (D.staff || []).filter(s => !st || !s.stage || s.stage === st);
  const lead = staff.filter(s => LEAD.test(s.role)), others = staff.filter(s => !LEAD.test(s.role));
  const person = s => `
    <div class="card" style="--g:${G('contact')}">
      <h3>${esc(s.name)}</h3>
      <div class="meta"><span class="tag">${esc(s.role)}</span>${s.stage ? `<span class="tag">المرحلة ${esc(s.stage)}</span>` : ''}${s.subjects ? `<span class="tag">${esc(s.subjects)}</span>` : ''}${s.grades ? `<span class="tag">${esc(s.grades)}</span>` : ''}</div>
      ${reach(s) ? '' : '<div class="muted">لم يُضف رقم تواصل بعد.</div>'}
    </div>`;
  return `
    ${head('contact', 'التواصل مع المدرسة')}
    ${lead.length ? `<div class="lead">${lead.map(s => `
      <div class="card" style="--g:${G('contact')}"><div class="av">${/المشرف/.test(s.role) ? '🛡️' : '🎓'}</div>
        <h3>${esc(s.name)}</h3><div class="muted">${esc(s.name === s.role ? (s.stage ? 'المرحلة ' + s.stage : 'جميع المراحل') : s.role)}</div></div>`).join('')}</div>` : ''}
    <div class="cols" style="margin-top:20px">
      <div class="panel">
        <h3>🔒 مراسلة خاصة</h3>
        <p class="muted">تُكتب الرسالة هنا ثم تُرسل مباشرة إلى الجهة المختارة عبر واتساب أو تلكرام، ولا يحتفظ الموقع بأي بيانات.</p>
        <div class="grid">
          <div class="full"><label for="to">إلى</label><select id="to">${staff.filter(reach).map(s => `<option value="${esc(s.id)}">${esc(s.name)}${s.subjects ? ' — ' + esc(s.subjects) : ''}</option>`).join('') || '<option value="">لم تُضف أرقام تواصل بعد</option>'}</select></div>
          <div><label for="pn">اسم ولي الأمر</label><input id="pn" autocomplete="name"></div>
          <div><label for="sn">اسم التلميذ أو الطالب</label><input id="sn"></div>
          <div><label for="sg">الصف</label><select id="sg">${audienceOptions(D, sel.grade, {all:false, stages:false})}</select></div>
          <div><label for="ss">الشعبة</label><input id="ss" placeholder="مثال: أ"></div>
          <div class="full"><label for="msg">الرسالة</label><textarea id="msg"></textarea></div>
        </div>
        <div id="err"></div>
        <div class="row" style="margin-top:12px"><button class="pri" id="send">إرسال الرسالة</button></div>
      </div>
      <div>
        <div class="card" style="--g:${G('contact')}">
          <h3>🏫 ${esc(sc.name)}</h3>
          <div class="body">${sc.founded ? '✨ تأسست عام ' + toAr(sc.founded) + '<br>' : ''}${sc.address ? '📍 ' + esc(sc.address) + '<br>' : ''}${sc.phone ? '☎️ <a href="tel:' + esc(sc.phone) + '" dir="ltr">' + esc(toAr(sc.phone)) + '</a><br>' : ''}${sc.hours ? '🕘 أوقات الدوام: ' + esc(sc.hours) : ''}</div>
        </div>
        <h2 class="sec" style="--g:${G('contact')}">الكادر التدريسي</h2>
        <div class="list">${others.map(person).join('') || emptyBox('لم يُضف الكادر التدريسي بعد.')}</div>
      </div>
    </div>`;
}
function wireContact(){
  $('#send').onclick = async () => {
    const s = (D.staff || []).find(x => x.id === $('#to').value), v = id => $(id).value.trim();
    if(!s) return $('#err').innerHTML = '<div class="alert">لا توجد جهة تواصل متاحة بعد.</div>';
    if(!v('#pn') || !v('#sn') || !v('#msg')) return $('#err').innerHTML = '<div class="alert">اكتب اسمك واسم التلميذ ونص الرسالة.</div>';
    $('#err').innerHTML = '';
    const text = `السلام عليكم ${s.name}\nأنا ${v('#pn')}، ولي أمر ${v('#sn')} — الصف ${$('#sg').value}${v('#ss') ? ' / ' + v('#ss') : ''}\n\n${v('#msg')}\n\n(مرسلة من بوابة ${D.school.name})`;
    const url = s.whatsapp ? 'https://wa.me/' + s.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(text) : 'https://t.me/' + s.telegram.replace(/^@/, '');
    if(!s.whatsapp){ try{ await navigator.clipboard.writeText(text); toast('نُسخت الرسالة، الصقها في تلكرام'); }catch(_){} }
    /* رابط حقيقي يضغطه ولي الأمر، فيعمل في كل المتصفحات والتطبيقات */
    $('#err').innerHTML = `<div class="notice">الرسالة جاهزة. اضغط الزر لفتح ${s.whatsapp ? 'واتساب' : 'تلكرام'} وإرسالها إلى ${esc(s.name)}.</div>
      <a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">${s.whatsapp ? 'فتح واتساب وإرسال الرسالة' : 'فتح تلكرام'}</a>`;
  };
}

/* ============ التوجيه ============ */
function route(){
  /* روابط بسيطة مثل #homework و #lesson-l1 (والصيغة القديمة #/homework ما زالت تعمل) */
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [k, id] = h.startsWith('lesson') ? ['lesson', h.replace(/^lesson[-/]/, '')] : [h.split('/')[0], ''];
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (k || 'home') || (k === 'lesson' && a.dataset.k === 'lessons')));
  const v = $('#view');
  if(k === 'contact'){ v.innerHTML = contact(); wireContact(); }
  else if(k === 'lesson') v.innerHTML = lesson(id);
  else if(CARD[k]){ v.innerHTML = section(k); fillSection(k); }
  else v.innerHTML = home();
  v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
  $('#nav a.on')?.scrollIntoView({inline:'center', block:'nearest'});
}
window.addEventListener('hashchange', () => { route(); window.scrollTo({top: $('.topnav').offsetTop, behavior:'smooth'}); });
route();
</script>
